<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-alt:#ECF1EF;
  --text:#16211D; --text-muted:#5C6A64; --border:#DCE3E0;
  --accent:#1F6F5C; --accent-contrast:#FFFFFF;
  --income:#2E8B57; --expense:#B23A48;
  --radius-lg:32px; --radius-md:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
    --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
    --accent:#4FBE9B; --accent-contrast:#08211B;
    --income:#55C285; --expense:#E0707A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
  --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
  --accent:#4FBE9B; --accent-contrast:#08211B;
  --income:#55C285; --expense:#E0707A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  min-height:100dvh;
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.phone{
  width:100%; max-width:430px; min-height:100dvh;
  background:var(--surface);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
@media (min-width:431px){
  body{padding:36px 16px;}
  .phone{min-height:844px; max-height:900px; border-radius:44px; box-shadow:0 30px 70px -24px rgba(0,0,0,.4); border:1px solid var(--border);}
}
@media (display-mode: standalone){
  .phone{border-radius:0; box-shadow:none; border:none;}
}
.topbar{
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar .label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); font-weight:600;}
.topbar .balance{font-family:'Sora',sans-serif; font-weight:800; font-size:36px; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; margin-top:6px;}
.topbar .sub{font-size:13px; color:var(--text-muted); margin-top:2px; font-weight:500;}
.content{flex:1; overflow-y:auto; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 28px);}
.view{display:none;}
.view.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.placeholder-card{
  background:var(--surface-alt); border-radius:var(--radius-md);
  padding:32px 22px; text-align:center; color:var(--text-muted);
  font-size:14px; line-height:1.55; margin-top:8px;
}
.placeholder-card strong{
  display:block; color:var(--text); font-family:'Sora',sans-serif;
  font-weight:700; font-size:17px; margin-bottom:8px;
}
.tabbar{
  position:absolute; left:0; right:0; bottom:0;
  display:flex; background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-muted);
  font-family:'Work Sans',sans-serif; font-size:10.5px; font-weight:600;
  padding:6px 2px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.tab-btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.tab-btn.active{color:var(--accent);}
@media (prefers-reduced-motion: reduce){ .view.active{animation:none;} }

.quincena-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
.qnav-btn{border:1px solid var(--border); background:var(--surface-alt); color:var(--text); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.qnav-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;}
.qnav-label{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; text-align:center; flex:1;}

.stat-label{font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.stat-value{font-family:'Sora',sans-serif; font-weight:700; font-size:19px; margin-top:6px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.amt-income{color:var(--income);}
.amt-expense{color:var(--expense);}
.restante-card{background:var(--accent); color:var(--accent-contrast); border-radius:var(--radius-md); padding:18px; margin-bottom:12px;}
.restante-card .stat-label{color:var(--accent-contrast); opacity:.8;}
.restante-card .stat-value{color:var(--accent-contrast); font-size:26px; margin-top:4px;}
.restante-card.negative{background:var(--expense);}

.goal-badge{border-radius:var(--radius-md); padding:14px 16px; margin-bottom:16px; text-align:center; font-size:13.5px; font-weight:600; line-height:1.5;}
.goal-badge.good{background:var(--income); color:#fff;}
.goal-badge.pending{background:var(--surface-alt); color:var(--text);}

.section-title{font-family:'Sora',sans-serif; font-weight:700; font-size:15px; margin:22px 0 6px;}
.section-title:first-child{margin-top:0;}

.calc-card{background:var(--surface-alt); border-radius:var(--radius-md); padding:18px 16px; margin-bottom:16px;}
.stepper-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.stepper{display:flex; align-items:center; gap:8px;}
.stepper button{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:17px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.stepper input{width:60px; text-align:center; border:1px solid var(--border); border-radius:9px; padding:7px; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; background:var(--surface); color:var(--text);}
.calc-result{margin-top:14px;}
.calc-result .val{font-family:'Sora',sans-serif; font-weight:800; font-size:24px; margin-top:4px;}
.calc-edit-link{display:block; background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; padding:10px 0 0; cursor:pointer; font-family:'Work Sans',sans-serif; text-align:left;}

.summary-link-card{display:block; width:100%; text-align:left; background:var(--surface-alt); border:none; border-radius:var(--radius-md); padding:16px; margin-bottom:12px; cursor:pointer; font-family:'Work Sans',sans-serif; color:var(--text);}
.summary-link-card .row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.summary-link-card .lbl{font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}
.summary-link-card .val{font-family:'Sora',sans-serif; font-weight:800; font-size:18px; margin-top:5px;}
.summary-link-card .chev{color:var(--text-muted); flex-shrink:0;}
.summary-link-card .chev svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;}

.breakdown-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.breakdown-row:last-child{border-bottom:none; padding-bottom:0;}
.breakdown-row:first-child{padding-top:0;}
.breakdown-row.total{font-weight:800; font-family:'Sora',sans-serif; font-size:15px; padding-top:14px; margin-top:4px; border-top:1px solid var(--border);}

.swipe-row{position:relative; overflow:hidden; border-bottom:1px solid var(--border);}
.swipe-actions{position:absolute; top:0; right:0; bottom:0; display:flex; width:140px;}
.swipe-action{flex:1; border:none; color:#fff; font-family:'Work Sans',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;}
.swipe-action.edit{background:#3B7FB8;}
.swipe-action.delete{background:var(--expense);}
.swipe-front{position:relative; z-index:1; background:var(--surface); transform:translateX(0px); touch-action:pan-y; -webkit-tap-highlight-color:transparent;}

.row-del{background:none; border:none; color:var(--text-muted); padding:6px; cursor:pointer; flex-shrink:0;}
.row-del svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
.row-confirm{display:flex; gap:6px; flex-shrink:0;}
.mini-btn{font-size:11px; font-weight:600; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
.mini-btn.danger{background:var(--expense); color:#fff; border-color:var(--expense);}

.fixed-summary{background:var(--surface-alt); border-radius:var(--radius-md); padding:16px; margin-bottom:16px;}
.fixed-summary-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.fixed-summary-row .paid{font-family:'Sora',sans-serif; font-weight:700; font-size:20px;}
.fixed-summary-row .of{font-size:12px; color:var(--text-muted);}
.progress-track{height:8px; background:var(--border); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:4px;}

.fixed-row{display:flex; align-items:center; gap:12px; padding:13px 2px;}
.fixed-check{width:24px; height:24px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface);}
.fixed-check.checked{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.fixed-check svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:3;}
.fixed-main{flex:1; min-width:0;}
.fixed-name{font-weight:600; font-size:14px;}
.fixed-name.paid-label{color:var(--text-muted); text-decoration:line-through;}
.fixed-amt{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums;}

.debt-card{background:var(--surface-alt); border-radius:var(--radius-md); padding:16px; margin-bottom:12px;}
.debt-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.debt-name{font-weight:700; font-size:14px;}
.debt-remaining{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; margin-top:4px; font-variant-numeric:tabular-nums;}
.debt-meta{font-size:12px; color:var(--text-muted); margin-top:2px;}
.debt-actions{display:flex; gap:8px; margin-top:12px;}
.debt-actions .mini-btn{flex:1; text-align:center; padding:9px;}
.debt-actions .mini-btn.primary{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}

.add-btn{
  width:100%; background:none; border:1px dashed var(--border); color:var(--accent);
  font-weight:700; font-size:13.5px; padding:14px; border-radius:var(--radius-md);
  cursor:pointer; margin-top:6px; font-family:'Work Sans',sans-serif;
}

.modal-overlay{position:absolute; inset:0; background:rgba(10,14,12,.5); display:flex; align-items:flex-end; z-index:30;}
.modal-overlay[hidden]{display:none;}
.sheet{width:100%; background:var(--surface); border-radius:24px 24px 0 0; padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 22px); max-height:90%; overflow-y:auto;}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.sheet-title{font-family:'Sora',sans-serif; font-weight:700; font-size:16px;}
.sheet-close{border:none; background:none; color:var(--text-muted); font-size:20px; padding:6px; cursor:pointer; line-height:1;}
.field-label{display:block; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px;}
.field-label:first-of-type{margin-top:0;}
.field-help{font-size:12px; color:var(--text-muted); margin-top:6px; line-height:1.4;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:13px; font-weight:600; padding:9px 15px; border-radius:20px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.date-input, .text-input, .num-input{width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Work Sans',sans-serif; font-size:14px; padding:11px 12px; border-radius:10px;}
.save-btn{width:100%; background:var(--accent); color:var(--accent-contrast); border:none; padding:16px; border-radius:14px; font-weight:700; font-size:15px; margin-top:26px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.save-btn:active{opacity:.85;}
.error-msg{color:var(--expense); font-size:12px; margin-top:8px; min-height:16px;}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script id="logic-script">
(function(){
  var STORAGE_KEY = 'appJuliFinanzasState';

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad(n){ return (n<10?'0':'')+n; }

  var DEFAULT_FIXED = [
    {id:uid(), name:'Ayuda', amount:200000, periodo:'ambas'},
    {id:uid(), name:'Madre', amount:70000, periodo:'ambas'},
    {id:uid(), name:'Jenn', amount:150000, periodo:'ambas'},
    {id:uid(), name:'Gasolina', amount:40000, periodo:'ambas'},
    {id:uid(), name:'Recibo', amount:130000, periodo:'05'},
    {id:uid(), name:'Google', amount:20000, periodo:'05'},
    {id:uid(), name:'Spotify', amount:29000, periodo:'05'},
    {id:uid(), name:'Crédito', amount:450000, periodo:'05'},
    {id:uid(), name:'Parqueadero', amount:100000, periodo:'20'},
    {id:uid(), name:'Crédito 2', amount:120000, periodo:'20'},
    {id:uid(), name:'Youtube', amount:31000, periodo:'20'},
    {id:uid(), name:'iCloud', amount:45000, periodo:'20'},
    {id:uid(), name:'Crédito', amount:300000, periodo:'20'}
  ];
  var DEFAULT_DEBTS = [
    {id:uid(), name:'Crédito Nequi 1', saldoInicial:6797458, cuota:931000},
    {id:uid(), name:'Crédito Nequi 2', saldoInicial:2534837, cuota:120000},
    {id:uid(), name:'Crédito Bancolombia', saldoInicial:1751437, cuota:220000},
    {id:uid(), name:'Moto', saldoInicial:1000000, cuota:0},
    {id:uid(), name:'Viaje', saldoInicial:600000, cuota:0},
    {id:uid(), name:'Tarjeta Bancolombia', saldoInicial:598594, cuota:180000},
    {id:uid(), name:'Tarjeta Nu', saldoInicial:736880, cuota:163345}
  ];

  // ---------- quincenas (se necesitan antes de loadState para migrar fechas) ----------
  function quincenaKeyForDate(iso){
    var d = new Date(iso+'T00:00:00');
    var day = d.getDate(), y = d.getFullYear(), m = d.getMonth()+1;
    if(day>=6 && day<=20) return y+'-'+pad(m)+'-20';
    if(day>=21){
      var nm=m+1, ny=y; if(nm>12){ nm=1; ny=y+1; }
      return ny+'-'+pad(nm)+'-05';
    }
    return y+'-'+pad(m)+'-05';
  }
  function currentQuincenaKey(){ return quincenaKeyForDate(todayISO()); }
  function quincenaLabel(key){
    var p = key.split('-'); var y=+p[0], m=+p[1], day=+p[2];
    var d = new Date(y, m-1, day);
    return 'Quincena del ' + day + ' de ' + d.toLocaleDateString('es-CO',{month:'long'});
  }
  function shiftQuincenaKey(key, dir){
    var p = key.split('-'); var y=+p[0], m=+p[1], day=+p[2];
    if(day===5){
      if(dir===-1){ var pm=m-1, py=y; if(pm<1){pm=12; py=y-1;} return py+'-'+pad(pm)+'-20'; }
      return y+'-'+pad(m)+'-20';
    }
    if(dir===-1) return y+'-'+pad(m)+'-05';
    var nm=m+1, ny=y; if(nm>12){nm=1; ny=y+1;} return ny+'-'+pad(nm)+'-05';
  }
  function quincenaType(key){ return key.slice(-2); }

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function loadState(){
    var s = null;
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) s = JSON.parse(raw);
    }catch(e){}
    if(!s || typeof s !== 'object'){
      try{ s = JSON.parse(document.getElementById('state-data').textContent) || {}; }
      catch(e){ s = {}; }
    }

    if(!Array.isArray(s.fixedExpenses)) s.fixedExpenses = DEFAULT_FIXED.slice();
    if(!Array.isArray(s.debts)) s.debts = DEFAULT_DEBTS.slice();
    if(typeof s.clientRate !== 'number') s.clientRate = 350000;
    if(typeof s.savingsGoal !== 'number') s.savingsGoal = 0;
    if(!s.fixedPaid || typeof s.fixedPaid !== 'object') s.fixedPaid = {};
    if(!s.clientCounts || typeof s.clientCounts !== 'object') s.clientCounts = {};
    if(!Array.isArray(s.debtPayments)) s.debtPayments = [];

    // Migración desde la versión anterior (basada en una lista de "transacciones").
    // Esto preserva lo ya marcado como pagado y el historial real de pagos de deudas.
    if((!s.schemaVersion || s.schemaVersion < 3) && Array.isArray(s.transactions)){
      s.transactions.forEach(function(t){
        if(!t || !t.date) return;
        var key = quincenaKeyForDate(t.date);
        if(t.kind==='fixed' && t.refId){
          if(!s.fixedPaid[key]) s.fixedPaid[key] = {};
          s.fixedPaid[key][t.refId] = true;
        } else if(t.kind==='debt' && t.refId){
          s.debtPayments.push({id: t.id || uid(), debtId: t.refId, amount: t.amount, date: t.date});
        } else if(t.kind==='client-income'){
          s.clientCounts[key] = (s.clientCounts[key]||0) + t.amount;
        }
      });
      var half = (s.clientRate||350000)/2;
      Object.keys(s.clientCounts).forEach(function(key){
        s.clientCounts[key] = half>0 ? Math.round(s.clientCounts[key]/half) : 0;
      });
      delete s.transactions;
    }
    if(typeof s.lastClientCount === 'number'){
      var curKey = currentQuincenaKey();
      if(s.clientCounts[curKey]==null) s.clientCounts[curKey] = s.lastClientCount;
      delete s.lastClientCount;
    }

    s.schemaVersion = 3;
    return s;
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  var state = loadState();
  saveState();
  var currentTab = 'resumen';
  var confirmDelete = null; // {type:'debt', id}
  var quickSheet = null;    // {title, fields:[...], onSave(values)}
  var viewingQuincena = null; // set on first render

  function fmtCOP(n){
    try{ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
    catch(e){ return '$' + Math.round(n); }
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

    resumen: '<svg viewBox="0 0 24 24"><path d="M4 12 L12 4 L20 12"/><path d="M6 10 V20 H18 V10"/></svg>',
    fijos: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="4" height="4" rx="1"/><path d="M11 7 H20"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 17 H20"/></svg>',
    deudas: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5 H21"/><path d="M6 15 H10"/></svg>',
    ahorro: '<svg viewBox="0 0 24 24"><path d="M4 17 L10 11 L14 15 L20 7"/><path d="M14 7 H20 V13"/></svg>'
  };
  var TRASH_ICON = '<svg viewBox="0 0 24 24"><path d="M5 7 H19"/><path d="M9 7 V4 H15 V7"/><path d="M7 7 L8 20 H16 L17 7"/></svg>';
  var CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M4 12 L9 17 L20 6"/></svg>';
  var CHEVRON_L = '<svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg>';
  var CHEVRON_R = '<svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>';

  var TABS = [
    {id:'resumen', label:'Resumen'},
    {id:'fijos', label:'Gastos fijos'},
    {id:'deudas', label:'Deudas'},
    {id:'ahorro', label:'Ahorro'}
  ];

  // ---------- cálculos centrales ----------
  function fixedAppliesTo(item, key){ return item.periodo==='ambas' || item.periodo===quincenaType(key); }
  function fixedIsPaid(item, key){ return !!(state.fixedPaid[key] && state.fixedPaid[key][item.id]); }
  function fixedTotalForKey(key){
    return state.fixedExpenses.filter(function(i){ return fixedAppliesTo(i,key); }).reduce(function(s,i){ return s+i.amount; }, 0);
  }
  function fixedPaidTotalForKey(key){
    return state.fixedExpenses.filter(function(i){ return fixedAppliesTo(i,key); })
      .reduce(function(s,i){ return s + (fixedIsPaid(i,key) ? i.amount : 0); }, 0);
  }
  function debtPaymentsInQuincena(key){
    return state.debtPayments.filter(function(p){ return quincenaKeyForDate(p.date)===key; });
  }
  function debtPaidAmountForKey(key){
    return debtPaymentsInQuincena(key).reduce(function(s,p){ return s+p.amount; }, 0);
  }
  function debtPaidTotal(debt){
    return state.debtPayments.reduce(function(s,p){ return s + (p.debtId===debt.id ? p.amount : 0); }, 0);
  }
  function clientesForKey(key){ return state.clientCounts[key] || 0; }
  function ingresoForKey(key){ return Math.round(clientesForKey(key) * (state.clientRate/2)); }
  function ahorroRealForKey(key){ return ingresoForKey(key) - fixedPaidTotalForKey(key) - debtPaidAmountForKey(key); }
  function allTrackedQuincenaKeys(){
    var keys = {};
    Object.keys(state.clientCounts).forEach(function(k){ keys[k]=true; });
    Object.keys(state.fixedPaid).forEach(function(k){ keys[k]=true; });
    state.debtPayments.forEach(function(p){ keys[quincenaKeyForDate(p.date)]=true; });
    return Object.keys(keys);
  }
  function computeTotalAhorroAcumulado(){
    return allTrackedQuincenaKeys().reduce(function(s,k){ return s + ahorroRealForKey(k); }, 0);
  }

  function quincenaNavHTML(key){
    return '<div class="quincena-nav">'
      + '<button type="button" class="qnav-btn" data-action="q-prev">'+CHEVRON_L+'</button>'
      + '<div class="qnav-label">'+quincenaLabel(key)+'</div>'
      + '<button type="button" class="qnav-btn" data-action="q-next">'+CHEVRON_R+'</button>'
      + '</div>';
  }

  function resumenContent(){
    var key = viewingQuincena;
    var clientes = clientesForKey(key);
    var ingreso = ingresoForKey(key);
    var fixedTotal = fixedTotalForKey(key);
    var fixedPaidAmt = fixedPaidTotalForKey(key);
    var debtPaidAmt = debtPaidAmountForKey(key);
    var ahorro = ingreso - fixedPaidAmt - debtPaidAmt;
    var meta = state.savingsGoal;
    var totalDeudaPendiente = state.debts.reduce(function(s,d){ return s + Math.max(0, d.saldoInicial - debtPaidTotal(d)); }, 0);

    var html = quincenaNavHTML(key);

    var cardCls = ahorro<0 ? 'restante-card negative' : 'restante-card';
    html += '<div class="'+cardCls+'"><div class="stat-label">Ahorro de esta quincena</div><div class="stat-value">'+fmtCOP(ahorro)+'</div></div>';

    if(meta>0){
      if(ahorro>=meta){
        html += '<div class="goal-badge good">Cumpliste tu meta de '+fmtCOP(meta)+' esta quincena.</div>';
      } else {
        html += '<div class="goal-badge pending">Te faltan <span class="amt-expense" style="font-weight:800;">'+fmtCOP(meta-ahorro)+'</span> para tu meta de '+fmtCOP(meta)+'.</div>';
      }
    }

    html += '<div class="section-title">Ingreso por clientes</div>';
    html += '<div class="calc-card">';
    html += '<div class="stepper-row"><span class="stat-label">Clientes activos</span>'
      + '<div class="stepper">'
        + '<button type="button" data-action="client-dec">−</button>'
        + '<input type="number" inputmode="numeric" id="client-count-input" value="'+clientes+'" />'
        + '<button type="button" data-action="client-inc">+</button>'
      + '</div></div>';
    html += '<div class="calc-result"><div class="stat-label">Ingreso de esta quincena</div><div class="val">'+fmtCOP(ingreso)+'</div></div>';
    html += '<button type="button" class="calc-edit-link" data-action="edit-rate">Tarifa mensual: '+fmtCOP(state.clientRate)+' · Editar</button>';
    html += '</div>';

    html += '<button type="button" class="summary-link-card" data-action="goto-fijos"><div class="row"><div><div class="lbl">Gastos fijos</div><div class="val">'+fmtCOP(fixedPaidAmt)+' de '+fmtCOP(fixedTotal)+'</div></div><span class="chev">'+CHEVRON_R+'</span></div></button>';
    html += '<button type="button" class="summary-link-card" data-action="goto-deudas"><div class="row"><div><div class="lbl">Deuda total pendiente</div><div class="val">'+fmtCOP(totalDeudaPendiente)+'</div></div><span class="chev">'+CHEVRON_R+'</span></div></button>';
    html += '<button type="button" class="summary-link-card" data-action="goto-ahorro"><div class="row"><div><div class="lbl">Meta de ahorro</div><div class="val">'+(meta>0?fmtCOP(meta):'Sin definir')+'</div></div><span class="chev">'+CHEVRON_R+'</span></div></button>';

    return html;
  }

  function fijosContent(){
    var key = currentQuincenaKey();
    var items = state.fixedExpenses.filter(function(i){ return fixedAppliesTo(i,key); });
    var total = items.reduce(function(s,i){ return s+i.amount; }, 0);
    var paid = items.reduce(function(s,i){ return s + (fixedIsPaid(i,key)? i.amount : 0); }, 0);
    var pct = total>0 ? Math.min(100, Math.round(paid/total*100)) : 0;

    var html = '<div class="fixed-summary">'
      + '<div class="stat-label">'+quincenaLabel(key)+'</div>'
      + '<div class="fixed-summary-row" style="margin-top:6px;"><span class="paid">'+fmtCOP(paid)+'</span><span class="of">de '+fmtCOP(total)+' pagados</span></div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      + '</div>';

    if(items.length===0){
      html += '<div class="placeholder-card"><strong>Sin gastos fijos todavía</strong>Agrega los que pagas cada quincena (arriendo, Spotify, ayudas, etc.) para marcarlos con un toque.</div>';
    } else {
      items.forEach(function(item){
        var paidNow = fixedIsPaid(item, key);
        html += '<div class="swipe-row">'
          + '<div class="swipe-actions">'
            + '<button type="button" class="swipe-action edit" data-action="edit-fixed" data-id="'+item.id+'">Editar</button>'
            + '<button type="button" class="swipe-action delete" data-action="delete-fixed-swipe" data-id="'+item.id+'">Eliminar</button>'
          + '</div>'
          + '<div class="swipe-front fixed-row">'
            + '<button type="button" class="fixed-check'+(paidNow?' checked':'')+'" data-action="toggle-fixed" data-id="'+item.id+'">'+(paidNow?CHECK_ICON:'')+'</button>'
            + '<div class="fixed-main"><div class="fixed-name'+(paidNow?' paid-label':'')+'">'+escapeHTML(item.name)+'</div></div>'
            + '<div class="fixed-amt">'+fmtCOP(item.amount)+'</div>'
          + '</div>'
        + '</div>';
      });
    }
    html += '<button type="button" class="add-btn" data-action="open-fixed-new">+ Agregar gasto fijo</button>';
    return html;
  }

  function deudasContent(){
    var totalRestante = state.debts.reduce(function(s,d){ return s + Math.max(0, d.saldoInicial - debtPaidTotal(d)); }, 0);
    var html = '<div class="restante-card"><div class="stat-label">Deuda total pendiente</div><div class="stat-value">'+fmtCOP(totalRestante)+'</div></div>';

    if(state.debts.length===0){
      html += '<div class="placeholder-card"><strong>Sin deudas registradas</strong>Agrega tus créditos o tarjetas para ver cuánto te falta por pagar.</div>';
    } else {
      state.debts.forEach(function(d){
        var paid = debtPaidTotal(d);
        var remaining = Math.max(0, d.saldoInicial - paid);
        var pct = d.saldoInicial>0 ? Math.min(100, Math.round(paid/d.saldoInicial*100)) : 0;
        var isConfirm = confirmDelete && confirmDelete.type==='debt' && confirmDelete.id===d.id;
        html += '<div class="debt-card">'
          + '<div class="debt-head"><div><div class="debt-name">'+escapeHTML(d.name)+'</div>'
          + '<div class="debt-remaining">'+fmtCOP(remaining)+'</div>'
          + '<div class="debt-meta">Cuota '+fmtCOP(d.cuota)+' · Abonado '+fmtCOP(paid)+' de '+fmtCOP(d.saldoInicial)+'</div></div>'
          + (isConfirm ? '' : '<button class="row-del" data-action="ask-delete-debt" data-id="'+d.id+'" aria-label="Eliminar deuda">'+TRASH_ICON+'</button>')
          + '</div>'
          + '<div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
        if(isConfirm){
          html += '<div class="row-confirm" style="margin-top:12px;"><button class="mini-btn danger" data-action="confirm-delete-debt" data-id="'+d.id+'">Eliminar deuda</button><button class="mini-btn" data-action="cancel-delete">Cancelar</button></div>';
        } else if(remaining>0){
          html += '<div class="debt-actions"><button class="mini-btn primary" data-action="open-debt-pay" data-id="'+d.id+'">Registrar pago</button></div>';
        }
        html += '</div>';
      });
    }
    html += '<button type="button" class="add-btn" data-action="open-debt-new">+ Agregar deuda</button>';
    return html;
  }

  function ahorroContent(){
    var key = viewingQuincena;
    var ingreso = ingresoForKey(key);
    var fixedPaidAmt = fixedPaidTotalForKey(key);
    var debtPaidAmt = debtPaidAmountForKey(key);
    var ahorro = ingreso - fixedPaidAmt - debtPaidAmt;
    var meta = state.savingsGoal;

    var html = quincenaNavHTML(key);

    html += '<div class="calc-card">'
      + '<div class="stat-label">Meta de ahorro por quincena</div>'
      + '<div class="calc-result" style="margin-top:4px;"><div class="val">'+(meta>0?fmtCOP(meta):'Sin definir')+'</div></div>'
      + '<button type="button" class="calc-edit-link" data-action="edit-goal">Editar meta</button>'
    + '</div>';

    html += '<div class="section-title">Cómo se calculó esta quincena</div>';
    html += '<div class="calc-card">'
      + '<div class="breakdown-row"><span>Ingreso por clientes</span><span class="amt-income" style="font-weight:700;">'+fmtCOP(ingreso)+'</span></div>'
      + '<div class="breakdown-row"><span>Gastos fijos pagados</span><span class="amt-expense" style="font-weight:700;">− '+fmtCOP(fixedPaidAmt)+'</span></div>'
      + '<div class="breakdown-row"><span>Cuotas de deuda pagadas</span><span class="amt-expense" style="font-weight:700;">− '+fmtCOP(debtPaidAmt)+'</span></div>'
      + '<div class="breakdown-row total"><span>Ahorro real</span><span>'+fmtCOP(ahorro)+'</span></div>'
    + '</div>';

    if(meta>0){
      if(ahorro>=meta) html += '<div class="goal-badge good">Cumpliste tu meta de ahorro de esta quincena.</div>';
      else html += '<div class="goal-badge pending">Te faltan <span class="amt-expense" style="font-weight:800;">'+fmtCOP(meta-ahorro)+'</span> para llegar a tu meta.</div>';
    } else {
      html += '<div class="placeholder-card"><strong>Define una meta</strong>Toca "Editar meta" arriba para fijar cuánto quieres ahorrar cada quincena y poder comparar.</div>';
    }

    return html;
  }

  function viewContent(id){
    if(id==='resumen') return resumenContent();
    if(id==='fijos') return fijosContent();
    if(id==='deudas') return deudasContent();
    if(id==='ahorro') return ahorroContent();
    return '';
  }

  function quickSheetHTML(){
    if(!quickSheet) return '<div class="modal-overlay" hidden></div>';
    var f = quickSheet.fields.map(function(field){
      var input;
      if(field.type==='number'){
        input = '<input type="number" inputmode="decimal" class="num-input" id="qs-'+field.id+'" value="'+(field.value!=null?field.value:'')+'" placeholder="'+(field.placeholder||'')+'" />';
      } else if(field.type==='date'){
        input = '<input type="date" class="date-input" id="qs-'+field.id+'" value="'+(field.value||todayISO())+'" />';
      } else if(field.type==='select'){
        input = '<div class="chip-row" data-field-group="'+field.id+'">' + field.options.map(function(opt){
          return '<button type="button" class="chip'+(field.value===opt.value?' active':'')+'" data-action="qs-select-option" data-field="'+field.id+'" data-value="'+opt.value+'">'+opt.label+'</button>';
        }).join('') + '</div>';
      } else {
        input = '<input type="text" class="text-input" id="qs-'+field.id+'" value="'+escapeHTML(field.value||'')+'" placeholder="'+(field.placeholder||'')+'" />';
      }
      return '<div class="field-label">'+field.label+'</div>'+input+(field.help? '<div class="field-help">'+field.help+'</div>' : '');
    }).join('');
    return ''
      + '<div class="modal-overlay">'
      + '<div class="sheet">'
        + '<div class="sheet-handle"></div>'
        + '<div class="sheet-header"><div class="sheet-title">'+quickSheet.title+'</div>'
        + '<button type="button" class="sheet-close" data-action="close-quicksheet" aria-label="Cerrar">✕</button></div>'
        + f
        + '<div class="error-msg" id="qs-error"></div>'
        + '<button type="button" class="save-btn" data-action="save-quicksheet">'+(quickSheet.saveLabel||'Guardar')+'</button>'
      + '</div>'
      + '</div>';
  }

  function render(){
    if(!viewingQuincena) viewingQuincena = currentQuincenaKey();
    var root = document.getElementById('app');
    var html = '';
    html += '<div class="topbar"><div class="label">Ahorro acumulado</div><div class="balance">' + fmtCOP(computeTotalAhorroAcumulado()) + '</div><div class="sub">Finanzas de Juli</div></div>';
    html += '<div class="content">';
    TABS.forEach(function(t){
      html += '<div class="view' + (t.id===currentTab ? ' active' : '') + '" data-view="' + t.id + '">' + viewContent(t.id) + '</div>';
    });
    html += '</div>';
    html += '<div class="tabbar">';
    TABS.forEach(function(t){
      html += '<button class="tab-btn' + (t.id===currentTab ? ' active' : '') + '" data-tab="' + t.id + '">' + ICONS[t.id] + '<span>' + t.label + '</span></button>';
    });
    html += '</div>';
    html += quickSheetHTML();
    root.innerHTML = html;

    var tabButtons = root.querySelectorAll('.tab-btn');
    for(var i=0;i<tabButtons.length;i++){
      tabButtons[i].addEventListener('click', function(e){
        currentTab = e.currentTarget.getAttribute('data-tab');
        confirmDelete = null;
        render();
      });
    }
    var clientInput = document.getElementById('client-count-input');
    if(clientInput){
      clientInput.addEventListener('change', function(){
        var v = Math.max(0, parseFloat(clientInput.value) || 0);
        state.clientCounts[viewingQuincena] = v;
        saveState(); render();
      });
    }
  }

  // ---------- quick sheet (gasto fijo nuevo/editar, deuda nueva/pago, tarifa, meta) ----------
  function openQuickSheet(config){ quickSheet = config; render(); }
  function closeQuickSheet(){ quickSheet = null; render(); }
  function handleSaveQuickSheet(){
    var values = {};
    quickSheet.fields.forEach(function(f){
      if(f.type==='select'){ values[f.id] = f.value; return; }
      var el = document.getElementById('qs-'+f.id);
      values[f.id] = f.type==='number' ? parseFloat(el.value) : el.value;
    });
    var error = quickSheet.onSave(values);
    if(error){ document.getElementById('qs-error').textContent = error; return; }
    saveState(); quickSheet = null; render();
  }

  function openEditRate(){
    openQuickSheet({
      title: 'Tarifa mensual por cliente',
      saveLabel: 'Guardar',
      fields: [
        {id:'tarifa', label:'Tarifa mensual por cliente', type:'number', value: state.clientRate, help:'Cada quincena se calcula como esta tarifa dividida entre 2, por cada cliente activo.'}

      onSave: function(v){
        if(!v.tarifa || v.tarifa<=0) return 'Ingresa una tarifa válida.';
        state.clientRate = v.tarifa;
        return null;
      }
    });
  }

  function openEditGoal(){
    openQuickSheet({
      title: 'Meta de ahorro',
      saveLabel: 'Guardar',
      fields: [
        {id:'meta', label:'¿Cuánto quieres ahorrar cada quincena?', type:'number', value: state.savingsGoal||'', placeholder:'Ej: 200000'}
      ],

  function openFixedNew(){
    openQuickSheet({
      title: 'Nuevo gasto fijo',
      saveLabel: 'Agregar',
      fields: [
        {id:'name', label:'Nombre', type:'text', placeholder:'Ej: Arriendo'},
        {id:'amount', label:'Monto', type:'number', placeholder:'Ej: 200000'},
        {id:'periodo', label:'¿En qué quincena se paga?', type:'select', value:'ambas', options:[
          {value:'ambas', label:'Ambas'},
          {value:'05', label:'Solo quincena 5'},
          {value:'20', label:'Solo quincena 20'}
        ]}
      ],
      onSave: function(v){
        if(!v.name || !v.name.trim()) return 'Escribe un nombre.';
        if(!v.amount || v.amount<=0) return 'Ingresa un monto válido.';
        state.fixedExpenses.push({id: uid(), name: v.name.trim(), amount: v.amount, periodo: v.periodo||'ambas'});

      }
    });

  function toggleFixed(id){
    var item = state.fixedExpenses.filter(function(i){ return i.id===id; })[0];
    if(!item) return;
    var key = currentQuincenaKey();
    if(!state.fixedPaid[key]) state.fixedPaid[key] = {};
    if(state.fixedPaid[key][id]) delete state.fixedPaid[key][id];
    else state.fixedPaid[key][id] = true;
    saveState(); render();
  }
  function deleteFixed(id){
    state.fixedExpenses = state.fixedExpenses.filter(function(i){ return i.id!==id; });
    saveState(); render();
  }
  function openFixedEdit(id){
    var item = state.fixedExpenses.filter(function(i){ return i.id===id; })[0];
    if(!item) return;
    openQuickSheet({
      title: 'Editar gasto fijo',
      saveLabel: 'Guardar cambios',
      fields: [
        {id:'name', label:'Nombre', type:'text', value:item.name},
        {id:'amount', label:'Monto', type:'number', value:item.amount},
        {id:'periodo', label:'¿En qué quincena se paga?', type:'select', value:item.periodo||'ambas', options:[
          {value:'ambas', label:'Ambas'},
          {value:'05', label:'Solo quincena 5'},
          {value:'20', label:'Solo quincena 20'}
        ]}
      ],
      onSave: function(v){
        if(!v.name || !v.name.trim()) return 'Escribe un nombre.';
        if(!v.amount || v.amount<=0) return 'Ingresa un monto válido.';
        item.name = v.name.trim();
        item.amount = v.amount;
        item.periodo = v.periodo || 'ambas';
        return null;
      }
    });
  }

  function openDebtNew(){
    openQuickSheet({
      title: 'Nueva deuda',
      saveLabel: 'Agregar',
      fields: [
        {id:'name', label:'Nombre', type:'text', placeholder:'Ej: Tarjeta Falabella'},
        {id:'saldo', label:'Saldo pendiente hoy', type:'number', placeholder:'Ej: 3000000'},
        {id:'cuota', label:'Cuota que pagas normalmente', type:'number', placeholder:'Ej: 250000'}
      ],
      onSave: function(v){
        if(!v.name || !v.name.trim()) return 'Escribe un nombre.';
        if(!v.saldo || v.saldo<=0) return 'Ingresa el saldo pendiente.';
        state.debts.push({id: uid(), name: v.name.trim(), saldoInicial: v.saldo, cuota: v.cuota||0});
        return null;
      }
    });
  }
  function openDebtPay(debtId){
    var debt = state.debts.filter(function(d){ return d.id===debtId; })[0];
    if(!debt) return;
    openQuickSheet({
      title: 'Pago de ' + debt.name,
      saveLabel: 'Registrar pago',
      fields: [
        {id:'amount', label:'Monto del pago', type:'number', value: debt.cuota || ''},
        {id:'fecha', label:'Fecha', type:'date', value: todayISO()}
      ],
      onSave: function(v){
        if(!v.amount || v.amount<=0) return 'Ingresa un monto válido.';
        state.debtPayments.push({id: uid(), debtId: debt.id, amount: v.amount, date: v.fecha||todayISO()});
        return null;
      }
    });
  }
  function deleteDebt(id){
    state.debts = state.debts.filter(function(d){ return d.id!==id; });
    saveState(); confirmDelete = null; render();
  }

  // ---------- swipe-to-reveal (iOS style) ----------
  var SWIPE_WIDTH = 140;
  var swipeDrag = null;
  function closeSwipe(front){
    front.style.transform = 'translateX(0px)';
    front.removeAttribute('data-open');
  }
  document.addEventListener('pointerdown', function(e){
    var front = e.target.closest('.swipe-front');
    if(!front) return;
    document.querySelectorAll('.swipe-front[data-open="1"]').forEach(function(f){ if(f!==front) closeSwipe(f); });
    var isOpen = front.getAttribute('data-open')==='1';
    swipeDrag = { front: front, startX: e.clientX, baseX: isOpen ? -SWIPE_WIDTH : 0, moved:false };
  });
  document.addEventListener('pointermove', function(e){
    if(!swipeDrag) return;
    var dx = e.clientX - swipeDrag.startX;
    if(Math.abs(dx) > 4) swipeDrag.moved = true;
    var next = Math.min(0, Math.max(-SWIPE_WIDTH, swipeDrag.baseX + dx));
    swipeDrag.front.style.transform = 'translateX('+next+'px)';
  });
  document.addEventListener('pointerup', function(e){
    if(!swipeDrag) return;
    var dx = e.clientX - swipeDrag.startX;
    var final = Math.min(0, Math.max(-SWIPE_WIDTH, swipeDrag.baseX + dx));
    if(final <= -SWIPE_WIDTH/2){
      swipeDrag.front.style.transform = 'translateX(-'+SWIPE_WIDTH+'px)';
      swipeDrag.front.setAttribute('data-open','1');
    } else {
      closeSwipe(swipeDrag.front);
    }
    swipeDrag = null;
  });
  document.addEventListener('pointercancel', function(){ swipeDrag = null; });

  document.addEventListener('click', function(e){
    document.querySelectorAll('.swipe-front[data-open="1"]').forEach(function(f){
      if(!f.contains(e.target)) closeSwipe(f);
    });
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');
    if(action==='cancel-delete'){ confirmDelete=null; render(); }
    else if(action==='q-prev'){ viewingQuincena = shiftQuincenaKey(viewingQuincena,-1); render(); }
    else if(action==='q-next'){ viewingQuincena = shiftQuincenaKey(viewingQuincena,1); render(); }
    else if(action==='client-inc'){ state.clientCounts[viewingQuincena] = clientesForKey(viewingQuincena)+1; saveState(); render(); }
    else if(action==='client-dec'){ state.clientCounts[viewingQuincena] = Math.max(0, clientesForKey(viewingQuincena)-1); saveState(); render(); }
    else if(action==='edit-rate') openEditRate();
    else if(action==='edit-goal') openEditGoal();
    else if(action==='goto-fijos'){ currentTab='fijos'; render(); }
    else if(action==='goto-deudas'){ currentTab='deudas'; render(); }
    else if(action==='goto-ahorro'){ currentTab='ahorro'; render(); }
    else if(action==='open-fixed-new') openFixedNew();
    else if(action==='toggle-fixed') toggleFixed(id);
    else if(action==='edit-fixed') openFixedEdit(id);
    else if(action==='delete-fixed-swipe') deleteFixed(id);
    else if(action==='open-debt-new') openDebtNew();
    else if(action==='open-debt-pay') openDebtPay(id);
    else if(action==='ask-delete-debt'){ confirmDelete={type:'debt',id:id}; render(); }
    else if(action==='confirm-delete-debt'){ deleteDebt(id); }
    else if(action==='close-quicksheet') closeQuickSheet();
    else if(action==='save-quicksheet') handleSaveQuickSheet();
    else if(action==='qs-select-option'){
      var fieldId = btn.getAttribute('data-field');
      var val = btn.getAttribute('data-value');
      var f = quickSheet.fields.filter(function(x){ return x.id===fieldId; })[0];
      if(f){ f.value = val; }
      document.querySelectorAll('[data-field="'+fieldId+'"]').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-value')===val);
      });
    }
  });

  render();
})();
</script>
</body>
</html>
