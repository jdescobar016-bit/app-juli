<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-alt:#ECF1EF;
  --text:#16211D; --text-muted:#5C6A64; --border:#DCE3E0;
  --accent:#1F6F5C; --accent-contrast:#FFFFFF;
  --income:#2E8B57; --expense:#B23A48;
  --radius-lg:32px; --radius-md:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
    --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
    --accent:#4FBE9B; --accent-contrast:#08211B;
    --income:#55C285; --expense:#E0707A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
  --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
  --accent:#4FBE9B; --accent-contrast:#08211B;
  --income:#55C285; --expense:#E0707A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  min-height:100dvh;
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.phone{
  width:100%; max-width:430px; min-height:100dvh;
  background:var(--surface);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
@media (min-width:431px){
  body{padding:36px 16px;}
  .phone{min-height:844px; max-height:900px; border-radius:44px; box-shadow:0 30px 70px -24px rgba(0,0,0,.4); border:1px solid var(--border);}
}
@media (display-mode: standalone){
  .phone{border-radius:0; box-shadow:none; border:none;}
}
.topbar{
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar .label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); font-weight:600;}
.topbar .balance{font-family:'Sora',sans-serif; font-weight:800; font-size:40px; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; margin-top:6px;}
.topbar .sub{font-size:13px; color:var(--text-muted); margin-top:2px; font-weight:500;}
.content{flex:1; overflow-y:auto; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 108px);}
.view{display:none;}
.view.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.placeholder-card{
  background:var(--surface-alt); border-radius:var(--radius-md);
  padding:32px 22px; text-align:center; color:var(--text-muted);
  font-size:14px; line-height:1.55; margin-top:8px;
}
.placeholder-card strong{
  display:block; color:var(--text); font-family:'Sora',sans-serif;
  font-weight:700; font-size:17px; margin-bottom:8px;
}
.tabbar{
  position:absolute; left:0; right:0; bottom:0;
  display:flex; background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-muted);
  font-family:'Work Sans',sans-serif; font-size:11px; font-weight:600;
  padding:6px 2px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.tab-btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.tab-btn.active{color:var(--accent);}
@media (prefers-reduced-motion: reduce){ .view.active{animation:none;} }
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script id="state-data" type="application/json">{"transactions":[]}</script>

<script id="logic-script">
(function(){
  var state = JSON.parse(document.getElementById('state-data').textContent);
  var currentTab = 'resumen';

  function fmtCOP(n){
    try{ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
    catch(e){ return '$' + Math.round(n); }
  }

  var ICONS = {
    resumen: '<svg viewBox="0 0 24 24"><path d="M4 12 L12 4 L20 12"/><path d="M6 10 V20 H18 V10"/></svg>',
    movimientos: '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>',
    presupuestos: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4 V12 L18 16"/></svg>',
    metas: '<svg viewBox="0 0 24 24"><path d="M6 21 V4"/><path d="M6 4 H17 L14 8 L17 12 H6"/></svg>'
  };

  var TABS = [
    {id:'resumen', label:'Resumen'},
    {id:'movimientos', label:'Movimientos'},
    {id:'presupuestos', label:'Presupuestos'},
    {id:'metas', label:'Metas'}
  ];

  function viewContent(id){
    if(id==='resumen'){
      return '<div class="placeholder-card"><strong>Todavía no hay movimientos</strong>Cuando construyamos el registro de ingresos y gastos, aquí vas a ver el resumen de tu mes.</div>';
    }
    if(id==='movimientos'){
      return '<div class="placeholder-card"><strong>Sin movimientos todavía</strong>El siguiente paso es construir el formulario para agregar tus ingresos y gastos.</div>';
    }
    if(id==='presupuestos'){
      return '<div class="placeholder-card"><strong>Próximamente</strong>Aquí vas a poder definir cuánto quieres gastar por categoría cada mes.</div>';
    }
    if(id==='metas'){
      return '<div class="placeholder-card"><strong>Próximamente</strong>Aquí vas a poder crear metas de ahorro y ver tu progreso.</div>';
    }
    return '';
  }

  function computeBalance(){
    return state.transactions.reduce(function(sum,t){ return sum + (t.type==='income'? t.amount : -t.amount); }, 0);
  }

  function render(){
    var root = document.getElementById('app');
    var html = '';
    html += '<div class="topbar"><div class="label">Balance total</div><div class="balance">' + fmtCOP(computeBalance()) + '</div><div class="sub">Finanzas de Juli</div></div>';
    html += '<div class="content">';
    TABS.forEach(function(t){
      html += '<div class="view' + (t.id===currentTab ? ' active' : '') + '" data-view="' + t.id + '">' + viewContent(t.id) + '</div>';
    });
    html += '</div>';
    html += '<div class="tabbar">';
    TABS.forEach(function(t){
      html += '<button class="tab-btn' + (t.id===currentTab ? ' active' : '') + '" data-tab="' + t.id + '">' + ICONS[t.id] + '<span>' + t.label + '</span></button>';
    });
    html += '</div>';
    root.innerHTML = html;

    var buttons = root.querySelectorAll('.tab-btn');
    for(var i=0;i<buttons.length;i++){
      buttons[i].addEventListener('click', function(e){
        currentTab = e.currentTarget.getAttribute('data-tab');
        render();
      });
    }
  }

  render();
})();
</script>
</body>
</html>
