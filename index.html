<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-alt:#ECF1EF;
  --text:#16211D; --text-muted:#5C6A64; --border:#DCE3E0;
  --accent:#1F6F5C; --accent-contrast:#FFFFFF;
  --income:#2E8B57; --expense:#B23A48;
  --radius-lg:32px; --radius-md:16px;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
  --series-otros:#898781;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
    --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
    --accent:#4FBE9B; --accent-contrast:#08211B;
    --income:#55C285; --expense:#E0707A;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
    --series-otros:#898781;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
  --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
  --accent:#4FBE9B; --accent-contrast:#08211B;
  --income:#55C285; --expense:#E0707A;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  --series-otros:#898781;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  min-height:100dvh;
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.phone{
  width:100%; max-width:430px; min-height:100dvh;
  background:var(--surface);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
@media (min-width:431px){
  body{padding:36px 16px;}
  .phone{min-height:844px; max-height:900px; border-radius:44px; box-shadow:0 30px 70px -24px rgba(0,0,0,.4); border:1px solid var(--border);}
}
@media (display-mode: standalone){
  .phone{border-radius:0; box-shadow:none; border:none;}
}
.topbar{
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar .label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); font-weight:600;}
.topbar .balance{font-family:'Sora',sans-serif; font-weight:800; font-size:36px; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; margin-top:6px;}
.topbar .sub{font-size:13px; color:var(--text-muted); margin-top:2px; font-weight:500;}
.content{flex:1; overflow-y:auto; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 108px);}
.view{display:none;}
.view.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.placeholder-card{
  background:var(--surface-alt); border-radius:var(--radius-md);
  padding:32px 22px; text-align:center; color:var(--text-muted);
  font-size:14px; line-height:1.55; margin-top:8px;
}
.placeholder-card strong{
  display:block; color:var(--text); font-family:'Sora',sans-serif;
  font-weight:700; font-size:17px; margin-bottom:8px;
}
.tabbar{
  position:absolute; left:0; right:0; bottom:0;
  display:flex; background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-muted);
  font-family:'Work Sans',sans-serif; font-size:10.5px; font-weight:600;
  padding:6px 2px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.tab-btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.tab-btn.active{color:var(--accent);}
@media (prefers-reduced-motion: reduce){ .view.active{animation:none;} }

.quincena-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
.qnav-btn{border:1px solid var(--border); background:var(--surface-alt); color:var(--text); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.qnav-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;}
.qnav-label{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; text-align:center; flex:1;}

.stats-row{display:flex; gap:12px; margin-bottom:12px;}
.stat-card{flex:1; background:var(--surface-alt); border-radius:var(--radius-md); padding:16px; min-width:0;}
.stat-label{font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.stat-value{font-family:'Sora',sans-serif; font-weight:700; font-size:19px; margin-top:6px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.amt-income{color:var(--income);}
.amt-expense{color:var(--expense);}
.restante-card{background:var(--accent); color:var(--accent-contrast); border-radius:var(--radius-md); padding:18px; margin-bottom:16px;}
.restante-card .stat-label{color:var(--accent-contrast); opacity:.8;}
.restante-card .stat-value{color:var(--accent-contrast); font-size:26px; margin-top:4px;}
.restante-card.negative{background:var(--expense);}

.client-btn{
  width:100%; display:flex; align-items:center; gap:12px; background:var(--surface-alt);
  border:1px dashed var(--border); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:8px;
  cursor:pointer; text-align:left; color:var(--text); font-family:'Work Sans',sans-serif;
}
.client-btn .ic{width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.client-btn .ic svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2;}
.client-btn .tt{font-weight:700; font-size:13.5px;}
.client-btn .ds{font-size:12px; color:var(--text-muted); margin-top:2px;}

.section-title{font-family:'Sora',sans-serif; font-weight:700; font-size:15px; margin:22px 0 6px;}
.chart-card{background:var(--surface-alt); border-radius:var(--radius-md); padding:18px 16px;}
.chart-total-label{font-size:10.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
.chart-total-value{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; margin-top:3px; margin-bottom:16px;}
.stackbar{display:flex; gap:2px; width:100%; height:18px; border-radius:5px; overflow:hidden; background:var(--surface-alt); margin-bottom:18px;}
.stackbar-seg{height:100%; flex-shrink:0;}
.chart-list{display:flex; flex-direction:column; gap:0;}
.chart-list-row{display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px solid var(--border);}
.chart-list-row:last-child{border-bottom:none; padding-bottom:0;}
.chart-list-row:first-child{padding-top:0;}
.chart-list-row .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.chart-list-row .name{flex:1; font-size:13.5px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chart-list-row .pct{color:var(--text-muted); font-size:12px; width:34px; text-align:right; flex-shrink:0;}
.chart-list-row .amt{font-weight:700; font-size:13px; color:var(--text); width:92px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums;}
.chart-empty{color:var(--text-muted); font-size:13px; text-align:center; padding:20px 0;}

.tx-list{display:flex; flex-direction:column;}
.date-heading{font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 6px;}
.date-heading:first-child{margin-top:0;}

.swipe-row{position:relative; overflow:hidden; border-bottom:1px solid var(--border);}
.swipe-actions{position:absolute; top:0; right:0; bottom:0; display:flex; width:140px;}
.swipe-action{flex:1; border:none; color:#fff; font-family:'Work Sans',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;}
.swipe-action.edit{background:#3B7FB8;}
.swipe-action.delete{background:var(--expense);}
.swipe-front{position:relative; z-index:1; background:var(--surface); transform:translateX(0px); touch-action:pan-y; -webkit-tap-highlight-color:transparent;}
.tx-row{display:flex; align-items:center; gap:12px; padding:12px 2px;}
.tx-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.tx-main{flex:1; min-width:0;}
.tx-cat{font-weight:600; font-size:14px;}
.tx-note{font-size:12px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tx-right{text-align:right;}
.tx-amt{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums;}
.tx-date{font-size:11px; color:var(--text-muted); margin-top:2px;}
.row-del{background:none; border:none; color:var(--text-muted); padding:6px; cursor:pointer; flex-shrink:0;}
.row-del svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
.row-confirm{display:flex; gap:6px; flex-shrink:0;}
.mini-btn{font-size:11px; font-weight:600; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
.mini-btn.danger{background:var(--expense); color:#fff; border-color:var(--expense);}

.link-btn{display:block; width:100%; text-align:center; background:none; border:none; color:var(--accent); font-weight:600; font-size:13px; padding:16px 0 4px; cursor:pointer;}

.fixed-summary{background:var(--surface-alt); border-radius:var(--radius-md); padding:16px; margin-bottom:16px;}
.fixed-summary-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.fixed-summary-row .paid{font-family:'Sora',sans-serif; font-weight:700; font-size:20px;}
.fixed-summary-row .of{font-size:12px; color:var(--text-muted);}
.progress-track{height:8px; background:var(--border); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:4px;}

.fixed-row{display:flex; align-items:center; gap:12px; padding:13px 2px;}
.fixed-check{width:24px; height:24px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface);}
.fixed-check.checked{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.fixed-check svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:3;}
.fixed-main{flex:1; min-width:0;}
.fixed-name{font-weight:600; font-size:14px;}
.fixed-name.paid-label{color:var(--text-muted); text-decoration:line-through;}
.fixed-amt{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums;}

.debt-card{background:var(--surface-alt); border-radius:var(--radius-md); padding:16px; margin-bottom:12px;}
.debt-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.debt-name{font-weight:700; font-size:14px;}
.debt-remaining{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; margin-top:4px; font-variant-numeric:tabular-nums;}
.debt-meta{font-size:12px; color:var(--text-muted); margin-top:2px;}
.debt-actions{display:flex; gap:8px; margin-top:12px;}
.debt-actions .mini-btn{flex:1; text-align:center; padding:9px;}
.debt-actions .mini-btn.primary{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}


.add-btn{
  width:100%; background:none; border:1px dashed var(--border); color:var(--accent);
  font-weight:700; font-size:13.5px; padding:14px; border-radius:var(--radius-md);
  cursor:pointer; margin-top:6px; font-family:'Work Sans',sans-serif;
}

.fab{
  position:absolute; right:20px; bottom:calc(env(safe-area-inset-bottom,0px) + 88px);
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
  border:none; box-shadow:0 10px 24px -8px rgba(0,0,0,.45); font-size:30px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;
}
.fab[hidden]{display:none;}

.modal-overlay{position:absolute; inset:0; background:rgba(10,14,12,.5); display:flex; align-items:flex-end; z-index:30;}
.modal-overlay[hidden]{display:none;}
.sheet{width:100%; background:var(--surface); border-radius:24px 24px 0 0; padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 22px); max-height:90%; overflow-y:auto;}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.sheet-title{font-family:'Sora',sans-serif; font-weight:700; font-size:16px;}
.type-toggle{display:flex; background:var(--surface-alt); border-radius:12px; padding:4px; gap:4px;}
.type-btn{border:none; background:none; padding:9px 20px; border-radius:9px; font-weight:600; font-size:13px; color:var(--text-muted); cursor:pointer; font-family:'Work Sans',sans-serif;}
.type-btn.active{background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15);}
.sheet-close{border:none; background:none; color:var(--text-muted); font-size:20px; padding:6px; cursor:pointer; line-height:1;}
.field-label{display:block; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px;}
.field-help{font-size:12px; color:var(--text-muted); margin-top:6px; line-height:1.4;}
.amount-input{width:100%; border:none; background:none; font-family:'Sora',sans-serif; font-weight:800; font-size:38px; color:var(--text); font-variant-numeric:tabular-nums; padding:4px 0; border-bottom:2px solid var(--border); -webkit-appearance:none;}
.amount-input:focus{outline:none; border-color:var(--accent);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:13px; font-weight:600; padding:9px 15px; border-radius:20px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.date-input, .text-input, .num-input{width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Work Sans',sans-serif; font-size:14px; padding:11px 12px; border-radius:10px;}
.save-btn{width:100%; background:var(--accent); color:var(--accent-contrast); border:none; padding:16px; border-radius:14px; font-weight:700; font-size:15px; margin-top:26px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.save-btn:active{opacity:.85;}
.error-msg{color:var(--expense); font-size:12px; margin-top:8px; min-height:16px;}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script id="state-data" type="application/json">{"transactions":[]}</script>

<script id="logic-script">
(function(){
  var STORAGE_KEY = 'appJuliFinanzasState';

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad(n){ return (n<10?'0':'')+n; }

  var DEFAULT_FIXED = [
    {id:uid(), name:'Ayuda', amount:200000, periodo:'ambas'},
    {id:uid(), name:'Madre', amount:70000, periodo:'ambas'},
    {id:uid(), name:'Jenn', amount:150000, periodo:'ambas'},
    {id:uid(), name:'Gasolina', amount:40000, periodo:'ambas'},
    {id:uid(), name:'Recibo', amount:130000, periodo:'05'},
    {id:uid(), name:'Google', amount:20000, periodo:'05'},
    {id:uid(), name:'Spotify', amount:29000, periodo:'05'},
    {id:uid(), name:'Crédito', amount:450000, periodo:'05'},
    {id:uid(), name:'Parqueadero', amount:100000, periodo:'20'},
    {id:uid(), name:'Crédito 2', amount:120000, periodo:'20'},
    {id:uid(), name:'Youtube', amount:31000, periodo:'20'},
    {id:uid(), name:'iCloud', amount:45000, periodo:'20'},
    {id:uid(), name:'Crédito', amount:300000, periodo:'20'}
  ];
  var DEFAULT_DEBTS = [
    {id:uid(), name:'Crédito Nequi 1', saldoInicial:6797458, cuota:931000},
    {id:uid(), name:'Crédito Nequi 2', saldoInicial:2534837, cuota:120000},
    {id:uid(), name:'Crédito Bancolombia', saldoInicial:1751437, cuota:220000},
    {id:uid(), name:'Moto', saldoInicial:1000000, cuota:0},
    {id:uid(), name:'Viaje', saldoInicial:600000, cuota:0},
    {id:uid(), name:'Tarjeta Bancolombia', saldoInicial:598594, cuota:180000},
    {id:uid(), name:'Tarjeta Nu', saldoInicial:736880, cuota:163345}
  ];

  function loadState(){
    var s = null;
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ var parsed = JSON.parse(raw); if(parsed && Array.isArray(parsed.transactions)) s = parsed; }
    }catch(e){}
    if(!s){
      try{ s = JSON.parse(document.getElementById('state-data').textContent); }
      catch(e){ s = {transactions:[]}; }
    }
    if(!Array.isArray(s.transactions)) s.transactions = [];
    if(!Array.isArray(s.fixedExpenses)) s.fixedExpenses = DEFAULT_FIXED.slice();
    if(!Array.isArray(s.debts)) s.debts = DEFAULT_DEBTS.slice();
    if(typeof s.clientRate !== 'number') s.clientRate = 350000;
    if(typeof s.lastClientCount !== 'number') s.lastClientCount = 0;
    if(!s.schemaVersion || s.schemaVersion < 2){
      s.fixedExpenses = DEFAULT_FIXED.slice();
      s.debts = DEFAULT_DEBTS.slice();
      s.schemaVersion = 2;
    }
    return s;
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  var state = loadState();
  var currentTab = 'resumen';
  var confirmDelete = null; // {type:'debt', id}
  var modalOpen = false;      // transaction sheet
  var modalType = 'expense';
  var selectedCategory = null;
  var editingTxId = null;
  var quickSheet = null;      // {title, fields:[...], onSave(values)}
  var viewingQuincena = null; // set on first render

  var EXPENSE_CATS = ['Alimentación','Transporte','Vivienda','Servicios','Entretenimiento','Salud','Educación','Compras','Otros'];
  var INCOME_CATS = ['Salario','Freelance','Regalo','Ventas','Otros'];
  var CAT_COLORS = {};
  (function buildColors(){
    var palette = ['#1F6F5C','#3B7FB8','#B8862B','#8B5FBF','#B23A48','#4C8C6B','#C97A3D','#5C7AA0','#7A6A53','#2E8B57'];
    var all = EXPENSE_CATS.concat(INCOME_CATS);
    var seen = {}; var idx = 0;
    all.forEach(function(c){ if(!seen[c]){ seen[c]=true; CAT_COLORS[c]=palette[idx % palette.length]; idx++; } });
  })();

  function fmtCOP(n){
    try{ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
    catch(e){ return '$' + Math.round(n); }
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtDateShort(iso){
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  }
  function fmtDateLong(iso){
    var today = todayISO();
    var y = new Date(); y.setDate(y.getDate()-1);
    var yesterday = y.toISOString().slice(0,10);
    if(iso===today) return 'Hoy';
    if(iso===yesterday) return 'Ayer';
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('es-CO',{day:'numeric',month:'long'});
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- quincenas ----------
  function quincenaKeyForDate(iso){
    var d = new Date(iso+'T00:00:00');
    var day = d.getDate(), y = d.getFullYear(), m = d.getMonth()+1;
    if(day>=6 && day<=20) return y+'-'+pad(m)+'-20';
    if(day>=21){
      var nm=m+1, ny=y; if(nm>12){ nm=1; ny=y+1; }
      return ny+'-'+pad(nm)+'-05';
    }
    return y+'-'+pad(m)+'-05';
  }
  function currentQuincenaKey(){ return quincenaKeyForDate(todayISO()); }
  function quincenaLabel(key){
    var p = key.split('-'); var y=+p[0], m=+p[1], day=+p[2];
    var d = new Date(y, m-1, day);
    return 'Quincena del ' + day + ' de ' + d.toLocaleDateString('es-CO',{month:'long'});
  }
  function shiftQuincenaKey(key, dir){
    var p = key.split('-'); var y=+p[0], m=+p[1], day=+p[2];
    if(day===5){
      if(dir===-1){ var pm=m-1, py=y; if(pm<1){pm=12; py=y-1;} return py+'-'+pad(pm)+'-20'; }
      return y+'-'+pad(m)+'-20';
    }
    if(dir===-1) return y+'-'+pad(m)+'-05';
    var nm=m+1, ny=y; if(nm>12){nm=1; ny=y+1;} return ny+'-'+pad(nm)+'-05';
  }
  function txInQuincena(t, key){ return quincenaKeyForDate(t.date) === key; }

  var ICONS = {
    resumen: '<svg viewBox="0 0 24 24"><path d="M4 12 L12 4 L20 12"/><path d="M6 10 V20 H18 V10"/></svg>',
    movimientos: '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>',
    fijos: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="4" height="4" rx="1"/><path d="M11 7 H20"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 17 H20"/></svg>',
    deudas: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5 H21"/><path d="M6 15 H10"/></svg>',
    graficas: '<svg viewBox="0 0 24 24"><path d="M4 20 V4"/><path d="M4 20 H20"/><rect x="7" y="12" width="3" height="6" rx="0.8"/><rect x="12" y="8" width="3" height="10" rx="0.8"/><rect x="17" y="14" width="3" height="4" rx="0.8"/></svg>'
  };
  var TRASH_ICON = '<svg viewBox="0 0 24 24"><path d="M5 7 H19"/><path d="M9 7 V4 H15 V7"/><path d="M7 7 L8 20 H16 L17 7"/></svg>';
  var CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M4 12 L9 17 L20 6"/></svg>';
  var CHEVRON_L = '<svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg>';
  var CHEVRON_R = '<svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>';
  var CLIENT_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20 C5 15.5 8 13 12 13 C16 13 19 15.5 19 20"/></svg>';

  var TABS = [
    {id:'resumen', label:'Resumen'},
    {id:'movimientos', label:'Movimientos'},
    {id:'graficas', label:'Gráficas'},
    {id:'fijos', label:'Gastos fijos'},
    {id:'deudas', label:'Deudas'}
  ];

  function computeBalance(){
    return state.transactions.reduce(function(sum,t){ return sum + (t.type==='income'? t.amount : -t.amount); }, 0);
  }
  function sortedTransactions(){
    return state.transactions.slice().sort(function(a,b){
      if(a.date!==b.date) return b.date < a.date ? -1 : 1;
      return b.id.localeCompare(a.id);
    });
  }
  function quincenaTotals(key){
    var income=0, expense=0;
    state.transactions.forEach(function(t){
      if(!txInQuincena(t, key)) return;
      if(t.type==='income') income+=t.amount; else expense+=t.amount;
    });
    return {income:income, expense:expense, restante: income-expense};
  }

  function txRow(t){
    var color = CAT_COLORS[t.category] || '#5C6A64';
    var sign = t.type==='income' ? '+ ' : '− ';
    var amtClass = t.type==='income' ? 'amt-income' : 'amt-expense';
    return ''
      + '<div class="swipe-row">'
        + '<div class="swipe-actions">'
          + '<button type="button" class="swipe-action edit" data-action="edit-tx" data-id="'+t.id+'">Editar</button>'
          + '<button type="button" class="swipe-action delete" data-action="delete-tx-swipe" data-id="'+t.id+'">Eliminar</button>'
        + '</div>'
        + '<div class="swipe-front tx-row">'
          + '<span class="tx-dot" style="background:'+color+'"></span>'
          + '<div class="tx-main">'
            + '<div class="tx-cat">'+escapeHTML(t.category)+'</div>'
            + (t.note ? '<div class="tx-note">'+escapeHTML(t.note)+'</div>' : '')
          + '</div>'
          + '<div class="tx-right">'
            + '<div class="tx-amt '+amtClass+'">'+sign+fmtCOP(t.amount)+'</div>'
            + '<div class="tx-date">'+fmtDateShort(t.date)+'</div>'
          + '</div>'
        + '</div>'
      + '</div>';
  }

  function movimientosContent(){
    var list = sortedTransactions();
    if(list.length===0){
      return '<div class="placeholder-card"><strong>Sin movimientos todavía</strong>Toca el botón + de abajo para agregar tu primer ingreso o gasto.</div>';
    }
    var html = '<div class="tx-list">';
    var lastDate = null;
    list.forEach(function(t){
      if(t.date !== lastDate){ html += '<div class="date-heading">'+fmtDateLong(t.date)+'</div>'; lastDate = t.date; }
      html += txRow(t);
    });
    html += '</div>';
    return html;
  }

  function resumenContent(){
    var key = viewingQuincena;
    var totals = quincenaTotals(key);
    var recent = sortedTransactions().filter(function(t){ return txInQuincena(t,key); }).slice(0,5);
    var restCls = totals.restante < 0 ? 'restante-card negative' : 'restante-card';

    var html = '<div class="quincena-nav">'
      + '<button type="button" class="qnav-btn" data-action="q-prev">'+CHEVRON_L+'</button>'
      + '<div class="qnav-label">'+quincenaLabel(key)+'</div>'
      + '<button type="button" class="qnav-btn" data-action="q-next">'+CHEVRON_R+'</button>'
      + '</div>';
    html += '<div class="stats-row">'
      + '<div class="stat-card"><div class="stat-label">Ingresos</div><div class="stat-value amt-income">'+fmtCOP(totals.income)+'</div></div>'
      + '<div class="stat-card"><div class="stat-label">Gastos</div><div class="stat-value amt-expense">'+fmtCOP(totals.expense)+'</div></div>'
      + '</div>';
    html += '<div class="'+restCls+'"><div class="stat-label">Restante de la quincena</div><div class="stat-value">'+fmtCOP(totals.restante)+'</div></div>';

    html += '<button type="button" class="client-btn" data-action="open-client-income">'
      + '<span class="ic">'+CLIENT_ICON+'</span>'
      + '<span><span class="tt">Registrar ingreso por clientes</span><span class="ds" style="display:block;">Calcula el total según cuántos clientes tienes activos</span></span>'
      + '</button>';

    html += '<div class="section-title">Movimientos de esta quincena</div>';
    if(recent.length===0){
      html += '<div class="placeholder-card"><strong>Todavía no hay movimientos</strong>Toca el botón + para agregar tu primer ingreso o gasto.</div>';
    } else {
      html += '<div class="tx-list">';
      recent.forEach(function(t){ html += txRow(t); });
      html += '</div>';
      html += '<button class="link-btn" data-action="goto-movimientos">Ver todos los movimientos</button>';
    }
    return html;
  }

  // Las primeras 8 categorías de gasto tienen su propio color fijo (identidad estable,
  // validado para que se distingan incluso con daltonismo). Cualquier categoría fuera
  // de esta lista (o "Otros") se agrupa bajo "Otros" con un gris neutro, para nunca
  // inventar un noveno color que termine pareciéndose a otro.
  var CHART_SLOTTED_CATS = EXPENSE_CATS.filter(function(c){ return c!=='Otros'; }).slice(0,8);
  function catColorVar(cat){
    var idx = CHART_SLOTTED_CATS.indexOf(cat);
    return idx===-1 ? 'var(--series-otros)' : 'var(--series-'+(idx+1)+')';
  }

  function expenseChartCard(key){
    var byCat = {};
    state.transactions.forEach(function(t){
      if(t.type!=='expense' || !txInQuincena(t,key)) return;
      byCat[t.category] = (byCat[t.category]||0) + t.amount;
    });
    var total = Object.keys(byCat).reduce(function(s,c){ return s+byCat[c]; }, 0);
    if(total===0){
      return '<div class="chart-card"><div class="chart-empty">Sin gastos registrados en esta quincena todavía.</div></div>';
    }

    // Agrupar todo lo que no tiene slot propio dentro de "Otros"
    var grouped = {};
    Object.keys(byCat).forEach(function(c){
      var key2 = CHART_SLOTTED_CATS.indexOf(c)!==-1 ? c : 'Otros';
      grouped[key2] = (grouped[key2]||0) + byCat[c];
    });
    var cats = Object.keys(grouped).filter(function(c){ return c!=='Otros'; });
    cats.sort(function(a,b){ return grouped[b]-grouped[a]; });
    if(grouped['Otros']) cats.push('Otros');

    var html = '<div class="chart-card">';
    html += '<div class="chart-total-label">Total gastado en la quincena</div>';
    html += '<div class="chart-total-value">'+fmtCOP(total)+'</div>';

    html += '<div class="stackbar">';
    cats.forEach(function(c){
      var widthPct = (grouped[c]/total*100).toFixed(2);
      html += '<div class="stackbar-seg" style="width:'+widthPct+'%; background:'+catColorVar(c)+';"></div>';
    });
    html += '</div>';

    html += '<div class="chart-list">';
    cats.forEach(function(c){
      var amount = grouped[c];
      var pct = Math.round(amount/total*100);
      html += '<div class="chart-list-row">'
        + '<span class="dot" style="background:'+catColorVar(c)+'"></span>'
        + '<span class="name">'+escapeHTML(c)+'</span>'
        + '<span class="pct">'+pct+'%</span>'
        + '<span class="amt">'+fmtCOP(amount)+'</span>'
      + '</div>';
    });
    html += '</div>';
    html += '</div>';
    return html;
  }

  function graficasContent(){
    var key = viewingQuincena || currentQuincenaKey();
    var html = '<div class="quincena-nav">'
      + '<button type="button" class="qnav-btn" data-action="q-prev">'+CHEVRON_L+'</button>'
      + '<div class="qnav-label">'+quincenaLabel(key)+'</div>'
      + '<button type="button" class="qnav-btn" data-action="q-next">'+CHEVRON_R+'</button>'
      + '</div>';
    html += '<div class="section-title" style="margin-top:14px;">Gastos por categoría</div>';
    html += expenseChartCard(key);
    return html;
  }

  function quincenaType(key){ return key.slice(-2); }
  function fixedAppliesTo(item, key){
    return item.periodo==='ambas' || item.periodo===quincenaType(key);
  }
  function fixedIsPaid(item, key){
    return state.transactions.some(function(t){ return t.kind==='fixed' && t.refId===item.id && txInQuincena(t,key); });
  }
  function fijosContent(){
    var key = currentQuincenaKey();
    var items = state.fixedExpenses.filter(function(i){ return fixedAppliesTo(i,key); });
    var total = items.reduce(function(s,i){ return s+i.amount; }, 0);
    var paid = items.reduce(function(s,i){ return s + (fixedIsPaid(i,key)? i.amount : 0); }, 0);
    var pct = total>0 ? Math.min(100, Math.round(paid/total*100)) : 0;

    var html = '<div class="fixed-summary">'
      + '<div class="stat-label">'+quincenaLabel(key)+'</div>'
      + '<div class="fixed-summary-row" style="margin-top:6px;"><span class="paid">'+fmtCOP(paid)+'</span><span class="of">de '+fmtCOP(total)+' pagados</span></div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      + '</div>';

    if(items.length===0){
      html += '<div class="placeholder-card"><strong>Sin gastos fijos todavía</strong>Agrega los que pagas cada quincena (arriendo, Spotify, ayudas, etc.) para marcarlos con un toque.</div>';
    } else {
      items.forEach(function(item){
        var paidNow = fixedIsPaid(item, key);
        html += '<div class="swipe-row">'
          + '<div class="swipe-actions">'
            + '<button type="button" class="swipe-action edit" data-action="edit-fixed" data-id="'+item.id+'">Editar</button>'
            + '<button type="button" class="swipe-action delete" data-action="delete-fixed-swipe" data-id="'+item.id+'">Eliminar</button>'
          + '</div>'
          + '<div class="swipe-front fixed-row">'
            + '<button type="button" class="fixed-check'+(paidNow?' checked':'')+'" data-action="toggle-fixed" data-id="'+item.id+'">'+(paidNow?CHECK_ICON:'')+'</button>'
            + '<div class="fixed-main"><div class="fixed-name'+(paidNow?' paid-label':'')+'">'+escapeHTML(item.name)+'</div></div>'
            + '<div class="fixed-amt">'+fmtCOP(item.amount)+'</div>'
          + '</div>'
        + '</div>';
      });
    }
    html += '<button type="button" class="add-btn" data-action="open-fixed-new">+ Agregar gasto fijo</button>';
    return html;
  }

  function debtPaidTotal(debt){
    return state.transactions.reduce(function(s,t){ return s + (t.kind==='debt' && t.refId===debt.id ? t.amount : 0); }, 0);
  }
  function deudasContent(){
    var totalRestante = state.debts.reduce(function(s,d){ return s + Math.max(0, d.saldoInicial - debtPaidTotal(d)); }, 0);
    var html = '<div class="restante-card"><div class="stat-label">Deuda total pendiente</div><div class="stat-value">'+fmtCOP(totalRestante)+'</div></div>';

    if(state.debts.length===0){
      html += '<div class="placeholder-card"><strong>Sin deudas registradas</strong>Agrega tus créditos o tarjetas para ver cuánto te falta por pagar.</div>';
    } else {
      state.debts.forEach(function(d){
        var paid = debtPaidTotal(d);
        var remaining = Math.max(0, d.saldoInicial - paid);
        var pct = d.saldoInicial>0 ? Math.min(100, Math.round(paid/d.saldoInicial*100)) : 0;
        var isConfirm = confirmDelete && confirmDelete.type==='debt' && confirmDelete.id===d.id;
        html += '<div class="debt-card">'
          + '<div class="debt-head"><div><div class="debt-name">'+escapeHTML(d.name)+'</div>'
          + '<div class="debt-remaining">'+fmtCOP(remaining)+'</div>'
          + '<div class="debt-meta">Cuota '+fmtCOP(d.cuota)+' · Abonado '+fmtCOP(paid)+' de '+fmtCOP(d.saldoInicial)+'</div></div>'
          + (isConfirm ? '' : '<button class="row-del" data-action="ask-delete-debt" data-id="'+d.id+'" aria-label="Eliminar deuda">'+TRASH_ICON+'</button>')
          + '</div>'
          + '<div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
        if(isConfirm){
          html += '<div class="row-confirm" style="margin-top:12px;"><button class="mini-btn danger" data-action="confirm-delete-debt" data-id="'+d.id+'">Eliminar deuda</button><button class="mini-btn" data-action="cancel-delete">Cancelar</button></div>';
        } else if(remaining>0){
          html += '<div class="debt-actions"><button class="mini-btn primary" data-action="open-debt-pay" data-id="'+d.id+'">Registrar pago</button></div>';
        }
        html += '</div>';
      });
    }
    html += '<button type="button" class="add-btn" data-action="open-debt-new">+ Agregar deuda</button>';
    return html;
  }

  function viewContent(id){
    if(id==='resumen') return resumenContent();
    if(id==='movimientos') return movimientosContent();
    if(id==='graficas') return graficasContent();
    if(id==='fijos') return fijosContent();
    if(id==='deudas') return deudasContent();
    return '';
  }

  function categoriesFor(type){ return type==='income' ? INCOME_CATS : EXPENSE_CATS; }
  function chipsHTML(){
    var cats = categoriesFor(modalType).slice();
    if(selectedCategory && cats.indexOf(selectedCategory)===-1) cats.unshift(selectedCategory);
    return cats.map(function(c){
      return '<button type="button" class="chip'+(c===selectedCategory?' active':'')+'" data-action="select-cat" data-cat="'+c+'">'+c+'</button>';
    }).join('');
  }
  function txModalHTML(){
    var editing = editingTxId ? state.transactions.filter(function(t){ return t.id===editingTxId; })[0] : null;
    var amt = editing ? editing.amount : '';
    var dt = editing ? editing.date : todayISO();
    var nt = editing ? (editing.note||'') : '';
    return ''
      + '<div class="modal-overlay" id="modal-overlay"'+(modalOpen?'':' hidden')+'>'
      + '<div class="sheet">'
        + '<div class="sheet-handle"></div>'
        + '<div class="sheet-title" style="margin-bottom:14px;">'+(editing?'Editar movimiento':'Nuevo movimiento')+'</div>'
        + '<div class="sheet-header">'
          + '<div class="type-toggle">'
            + '<button type="button" class="type-btn'+(modalType==='expense'?' active':'')+'" data-action="select-type" data-type="expense">Gasto</button>'
            + '<button type="button" class="type-btn'+(modalType==='income'?' active':'')+'" data-action="select-type" data-type="income">Ingreso</button>'
          + '</div>'
          + '<button type="button" class="sheet-close" data-action="close-modal" aria-label="Cerrar">✕</button>'
        + '</div>'
        + '<input type="number" inputmode="decimal" id="input-amount" class="amount-input" placeholder="$ 0" value="'+(amt!==''?amt:'')+'" />'
        + '<div class="field-label">Categoría</div>'
        + '<div class="chip-row" id="category-chips">'+chipsHTML()+'</div>'
        + '<div class="field-label">Fecha</div>'
        + '<input type="date" id="input-date" class="date-input" value="'+dt+'" />'
        + '<div class="field-label">Nota (opcional)</div>'
        + '<input type="text" id="input-note" class="text-input" placeholder="Ej: Helado, mercado extra..." maxlength="60" value="'+escapeHTML(nt)+'" />'
        + '<div class="error-msg" id="modal-error"></div>'
        + '<button type="button" class="save-btn" data-action="save-tx">'+(editing?'Guardar cambios':'Guardar')+'</button>'
      + '</div>'
      + '</div>';
  }

  function quickSheetHTML(){
    if(!quickSheet) return '<div class="modal-overlay" hidden></div>';
    var f = quickSheet.fields.map(function(field){
      var input;
      if(field.type==='number'){
        input = '<input type="number" inputmode="decimal" class="num-input" id="qs-'+field.id+'" value="'+(field.value!=null?field.value:'')+'" placeholder="'+(field.placeholder||'')+'" />';
      } else if(field.type==='date'){
        input = '<input type="date" class="date-input" id="qs-'+field.id+'" value="'+(field.value||todayISO())+'" />';
      } else if(field.type==='select'){
        input = '<div class="chip-row" data-field-group="'+field.id+'">' + field.options.map(function(opt){
          return '<button type="button" class="chip'+(field.value===opt.value?' active':'')+'" data-action="qs-select-option" data-field="'+field.id+'" data-value="'+opt.value+'">'+opt.label+'</button>';
        }).join('') + '</div>';
      } else {
        input = '<input type="text" class="text-input" id="qs-'+field.id+'" value="'+escapeHTML(field.value||'')+'" placeholder="'+(field.placeholder||'')+'" />';
      }
      return '<div class="field-label">'+field.label+'</div>'+input+(field.help? '<div class="field-help">'+field.help+'</div>' : '');
    }).join('');
    return ''
      + '<div class="modal-overlay">'
      + '<div class="sheet">'
        + '<div class="sheet-handle"></div>'
        + '<div class="sheet-header"><div class="sheet-title">'+quickSheet.title+'</div>'
        + '<button type="button" class="sheet-close" data-action="close-quicksheet" aria-label="Cerrar">✕</button></div>'
        + f
        + '<div class="error-msg" id="qs-error"></div>'
        + '<button type="button" class="save-btn" data-action="save-quicksheet">'+(quickSheet.saveLabel||'Guardar')+'</button>'
      + '</div>'
      + '</div>';
  }

  function render(){
    if(!viewingQuincena) viewingQuincena = currentQuincenaKey();
    var root = document.getElementById('app');
    var showFab = (currentTab==='resumen' || currentTab==='movimientos');
    var html = '';
    html += '<div class="topbar"><div class="label">Balance total</div><div class="balance">' + fmtCOP(computeBalance()) + '</div><div class="sub">Finanzas de Juli</div></div>';
    html += '<div class="content">';
    TABS.forEach(function(t){
      html += '<div class="view' + (t.id===currentTab ? ' active' : '') + '" data-view="' + t.id + '">' + viewContent(t.id) + '</div>';
    });
    html += '</div>';
    html += '<button type="button" class="fab" data-action="open-modal"'+(showFab?'':' hidden')+' aria-label="Agregar movimiento">+</button>';
    html += '<div class="tabbar">';
    TABS.forEach(function(t){
      html += '<button class="tab-btn' + (t.id===currentTab ? ' active' : '') + '" data-tab="' + t.id + '">' + ICONS[t.id] + '<span>' + t.label + '</span></button>';
    });
    html += '</div>';
    html += txModalHTML();
    html += quickSheetHTML();
    root.innerHTML = html;

    var tabButtons = root.querySelectorAll('.tab-btn');
    for(var i=0;i<tabButtons.length;i++){
      tabButtons[i].addEventListener('click', function(e){
        currentTab = e.currentTarget.getAttribute('data-tab');
        confirmDelete = null;
        render();
      });
    }
    if(modalOpen){
      var amountInput = document.getElementById('input-amount');
      if(amountInput) amountInput.focus();
    }
  }

  // ---------- transaction sheet ----------
  function openModal(){
    editingTxId = null;
    modalType = 'expense';
    selectedCategory = EXPENSE_CATS[0];
    modalOpen = true;
    render();
  }
  function openEditTx(id){
    var t = state.transactions.filter(function(x){ return x.id===id; })[0];
    if(!t) return;
    editingTxId = id;
    modalType = t.type;
    selectedCategory = t.category;
    modalOpen = true;
    render();
  }
  function closeModal(){ modalOpen = false; editingTxId = null; render(); }
  function setModalType(type){
    modalType = type;
    selectedCategory = categoriesFor(type)[0];
    var chips = document.getElementById('category-chips');
    if(chips) chips.innerHTML = chipsHTML();
    document.querySelectorAll('.type-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-type')===type); });
  }
  function selectCategory(cat){
    selectedCategory = cat;
    document.querySelectorAll('#category-chips .chip').forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-cat')===cat); });
  }
  function handleSaveTx(){
    var amountInput = document.getElementById('input-amount');
    var dateInput = document.getElementById('input-date');
    var noteInput = document.getElementById('input-note');
    var errorEl = document.getElementById('modal-error');
    var amount = parseFloat(amountInput.value);
    if(!amount || amount<=0){ errorEl.textContent = 'Ingresa un monto válido, mayor a cero.'; return; }
    if(!selectedCategory){ errorEl.textContent = 'Elige una categoría.'; return; }
    var date = dateInput.value || todayISO();
    var note = (noteInput.value||'').trim();
    if(editingTxId){
      var existing = state.transactions.filter(function(t){ return t.id===editingTxId; })[0];
      if(existing){ existing.type=modalType; existing.amount=amount; existing.category=selectedCategory; existing.date=date; existing.note=note; }
    } else {
      state.transactions.push({ id: uid(), type: modalType, amount: amount, category: selectedCategory, date: date, note: note, kind:'manual' });
    }
    saveState();
    modalOpen = false;
    editingTxId = null;
    render();
  }
  function deleteTx(id){
    state.transactions = state.transactions.filter(function(t){ return t.id !== id; });
    saveState(); render();
  }

  // ---------- quick sheet (client income / fixed new / debt new / debt pay) ----------
  function openQuickSheet(config){ quickSheet = config; render(); }
  function closeQuickSheet(){ quickSheet = null; render(); }
  function handleSaveQuickSheet(){
    var values = {};
    quickSheet.fields.forEach(function(f){
      if(f.type==='select'){ values[f.id] = f.value; return; }
      var el = document.getElementById('qs-'+f.id);
      values[f.id] = f.type==='number' ? parseFloat(el.value) : el.value;
    });
    var error = quickSheet.onSave(values);
    if(error){ document.getElementById('qs-error').textContent = error; return; }
    saveState(); quickSheet = null; render();
  }

  function openClientIncome(){
    openQuickSheet({
      title: 'Ingreso por clientes',
      saveLabel: 'Registrar ingreso',
      fields: [
        {id:'clientes', label:'Clientes activos', type:'number', placeholder:'Ej: 16'},
        {id:'tarifa', label:'Tarifa mensual por cliente', type:'number', value: state.clientRate},
        {id:'fecha', label:'Fecha', type:'date', value: todayISO(), help:'Se calcula como (clientes × tarifa mensual) ÷ 2, porque es el ingreso de una quincena.'}
      ],
      onSave: function(v){
        if(!v.clientes || v.clientes<=0) return 'Ingresa cuántos clientes tienes activos.';
        if(!v.tarifa || v.tarifa<=0) return 'Ingresa una tarifa válida.';
        var total = Math.round(v.clientes * (v.tarifa/2));
        state.clientRate = v.tarifa;
        state.lastClientCount = v.clientes;
        state.transactions.push({
          id: uid(), type:'income', amount: total, category:'Clientes',
          date: v.fecha || todayISO(),
          note: v.clientes + ' clientes × ' + fmtCOP(v.tarifa/2),
          kind:'client-income'
        });
        return null;
      }
    });
  }

  function openFixedNew(){
    openQuickSheet({
      title: 'Nuevo gasto fijo',
      saveLabel: 'Agregar',
      fields: [
        {id:'name', label:'Nombre', type:'text', placeholder:'Ej: Arriendo'},
        {id:'amount', label:'Monto', type:'number', placeholder:'Ej: 200000'},
        {id:'periodo', label:'¿En qué quincena se paga?', type:'select', value:'ambas', options:[
          {value:'ambas', label:'Ambas'},
          {value:'05', label:'Solo quincena 5'},
          {value:'20', label:'Solo quincena 20'}
        ]}
      ],
      onSave: function(v){
        if(!v.name || !v.name.trim()) return 'Escribe un nombre.';
        if(!v.amount || v.amount<=0) return 'Ingresa un monto válido.';
        state.fixedExpenses.push({id: uid(), name: v.name.trim(), amount: v.amount, periodo: v.periodo||'ambas'});
        return null;
      }
    });
  }
  function toggleFixed(id){
    var item = state.fixedExpenses.filter(function(i){ return i.id===id; })[0];
    if(!item) return;
    var key = currentQuincenaKey();
    var existing = state.transactions.filter(function(t){ return t.kind==='fixed' && t.refId===id && txInQuincena(t,key); })[0];
    if(existing){
      state.transactions = state.transactions.filter(function(t){ return t.id !== existing.id; });
    } else {
      state.transactions.push({ id: uid(), type:'expense', amount:item.amount, category:item.name, date: todayISO(), note:'', kind:'fixed', refId:id });
    }
    saveState(); render();
  }
  function deleteFixed(id){
    state.fixedExpenses = state.fixedExpenses.filter(function(i){ return i.id!==id; });
    saveState(); render();
  }
  function openFixedEdit(id){
    var item = state.fixedExpenses.filter(function(i){ return i.id===id; })[0];
    if(!item) return;
    openQuickSheet({
      title: 'Editar gasto fijo',
      saveLabel: 'Guardar cambios',
      fields: [
        {id:'name', label:'Nombre', type:'text', value:item.name},
        {id:'amount', label:'Monto', type:'number', value:item.amount},
        {id:'periodo', label:'¿En qué quincena se paga?', type:'select', value:item.periodo||'ambas', options:[
          {value:'ambas', label:'Ambas'},
          {value:'05', label:'Solo quincena 5'},
          {value:'20', label:'Solo quincena 20'}
        ]}
      ],
      onSave: function(v){
        if(!v.name || !v.name.trim()) return 'Escribe un nombre.';
        if(!v.amount || v.amount<=0) return 'Ingresa un monto válido.';
        item.name = v.name.trim();
        item.amount = v.amount;
        item.periodo = v.periodo || 'ambas';
        return null;
      }
    });
  }

  function openDebtNew(){
    openQuickSheet({
      title: 'Nueva deuda',
      saveLabel: 'Agregar',
      fields: [
        {id:'name', label:'Nombre', type:'text', placeholder:'Ej: Tarjeta Falabella'},
        {id:'saldo', label:'Saldo pendiente hoy', type:'number', placeholder:'Ej: 3000000'},
        {id:'cuota', label:'Cuota que pagas normalmente', type:'number', placeholder:'Ej: 250000'}
      ],
      onSave: function(v){
        if(!v.name || !v.name.trim()) return 'Escribe un nombre.';
        if(!v.saldo || v.saldo<=0) return 'Ingresa el saldo pendiente.';
        state.debts.push({id: uid(), name: v.name.trim(), saldoInicial: v.saldo, cuota: v.cuota||0});
        return null;
      }
    });
  }
  function openDebtPay(debtId){
    var debt = state.debts.filter(function(d){ return d.id===debtId; })[0];
    if(!debt) return;
    openQuickSheet({
      title: 'Pago de ' + debt.name,
      saveLabel: 'Registrar pago',
      fields: [
        {id:'amount', label:'Monto del pago', type:'number', value: debt.cuota || ''},
        {id:'fecha', label:'Fecha', type:'date', value: todayISO()}
      ],
      onSave: function(v){
        if(!v.amount || v.amount<=0) return 'Ingresa un monto válido.';
        state.transactions.push({ id: uid(), type:'expense', amount:v.amount, category:'Deuda: '+debt.name, date: v.fecha||todayISO(), note:'', kind:'debt', refId: debt.id });
        return null;
      }
    });
  }
  function deleteDebt(id){
    state.debts = state.debts.filter(function(d){ return d.id!==id; });
    saveState(); confirmDelete = null; render();
  }

  // ---------- swipe-to-reveal (iOS style) ----------
  var SWIPE_WIDTH = 140;
  var swipeDrag = null;
  function closeSwipe(front){
    front.style.transform = 'translateX(0px)';
    front.removeAttribute('data-open');
  }
  document.addEventListener('pointerdown', function(e){
    var front = e.target.closest('.swipe-front');
    if(!front) return;
    document.querySelectorAll('.swipe-front[data-open="1"]').forEach(function(f){ if(f!==front) closeSwipe(f); });
    var isOpen = front.getAttribute('data-open')==='1';
    swipeDrag = { front: front, startX: e.clientX, baseX: isOpen ? -SWIPE_WIDTH : 0, moved:false };
  });
  document.addEventListener('pointermove', function(e){
    if(!swipeDrag) return;
    var dx = e.clientX - swipeDrag.startX;
    if(Math.abs(dx) > 4) swipeDrag.moved = true;
    var next = Math.min(0, Math.max(-SWIPE_WIDTH, swipeDrag.baseX + dx));
    swipeDrag.front.style.transform = 'translateX('+next+'px)';
  });
  document.addEventListener('pointerup', function(e){
    if(!swipeDrag) return;
    var dx = e.clientX - swipeDrag.startX;
    var final = Math.min(0, Math.max(-SWIPE_WIDTH, swipeDrag.baseX + dx));
    if(final <= -SWIPE_WIDTH/2){
      swipeDrag.front.style.transform = 'translateX(-'+SWIPE_WIDTH+'px)';
      swipeDrag.front.setAttribute('data-open','1');
    } else {
      closeSwipe(swipeDrag.front);
    }
    swipeDrag = null;
  });
  document.addEventListener('pointercancel', function(){ swipeDrag = null; });

  document.addEventListener('click', function(e){
    document.querySelectorAll('.swipe-front[data-open="1"]').forEach(function(f){
      if(!f.contains(e.target)) closeSwipe(f);
    });
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');
    if(action==='open-modal') openModal();
    else if(action==='close-modal') closeModal();
    else if(action==='select-type') setModalType(btn.getAttribute('data-type'));
    else if(action==='select-cat') selectCategory(btn.getAttribute('data-cat'));
    else if(action==='save-tx') handleSaveTx();
    else if(action==='edit-tx') openEditTx(id);
    else if(action==='delete-tx-swipe') deleteTx(id);
    else if(action==='cancel-delete'){ confirmDelete=null; render(); }
    else if(action==='goto-movimientos'){ currentTab='movimientos'; render(); }
    else if(action==='q-prev'){ viewingQuincena = shiftQuincenaKey(viewingQuincena,-1); render(); }
    else if(action==='q-next'){ viewingQuincena = shiftQuincenaKey(viewingQuincena,1); render(); }
    else if(action==='open-client-income') openClientIncome();
    else if(action==='open-fixed-new') openFixedNew();
    else if(action==='toggle-fixed') toggleFixed(id);
    else if(action==='edit-fixed') openFixedEdit(id);
    else if(action==='delete-fixed-swipe') deleteFixed(id);
    else if(action==='open-debt-new') openDebtNew();
    else if(action==='open-debt-pay') openDebtPay(id);
    else if(action==='ask-delete-debt'){ confirmDelete={type:'debt',id:id}; render(); }
    else if(action==='confirm-delete-debt'){ deleteDebt(id); }
    else if(action==='close-quicksheet') closeQuickSheet();
    else if(action==='save-quicksheet') handleSaveQuickSheet();
    else if(action==='qs-select-option'){
      var fieldId = btn.getAttribute('data-field');
      var val = btn.getAttribute('data-value');
      var f = quickSheet.fields.filter(function(x){ return x.id===fieldId; })[0];
      if(f){ f.value = val; }
      document.querySelectorAll('[data-field="'+fieldId+'"]').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-value')===val);
      });
    }
  });

  render();
})();
</script>
</body>
</html>
