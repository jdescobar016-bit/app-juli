<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-alt:#ECF1EF;
  --text:#16211D; --text-muted:#5C6A64; --border:#DCE3E0;
  --accent:#1F6F5C; --accent-contrast:#FFFFFF;
  --income:#2E8B57; --expense:#B23A48;
  --radius-lg:32px; --radius-md:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
    --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
    --accent:#4FBE9B; --accent-contrast:#08211B;
    --income:#55C285; --expense:#E0707A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-alt:#1D2823;
  --text:#E7EDE9; --text-muted:#9AAAA2; --border:#2A3733;
  --accent:#4FBE9B; --accent-contrast:#08211B;
  --income:#55C285; --expense:#E0707A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  min-height:100dvh;
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.phone{
  width:100%; max-width:430px; min-height:100dvh;
  background:var(--surface);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
@media (min-width:431px){
  body{padding:36px 16px;}
  .phone{min-height:844px; max-height:900px; border-radius:44px; box-shadow:0 30px 70px -24px rgba(0,0,0,.4); border:1px solid var(--border);}
}
@media (display-mode: standalone){
  .phone{border-radius:0; box-shadow:none; border:none;}
}
.topbar{
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar .label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); font-weight:600;}
.topbar .balance{font-family:'Sora',sans-serif; font-weight:800; font-size:40px; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; margin-top:6px;}
.topbar .sub{font-size:13px; color:var(--text-muted); margin-top:2px; font-weight:500;}
.content{flex:1; overflow-y:auto; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 108px);}
.view{display:none;}
.view.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.placeholder-card{
  background:var(--surface-alt); border-radius:var(--radius-md);
  padding:32px 22px; text-align:center; color:var(--text-muted);
  font-size:14px; line-height:1.55; margin-top:8px;
}
.placeholder-card strong{
  display:block; color:var(--text); font-family:'Sora',sans-serif;
  font-weight:700; font-size:17px; margin-bottom:8px;
}
.tabbar{
  position:absolute; left:0; right:0; bottom:0;
  display:flex; background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-muted);
  font-family:'Work Sans',sans-serif; font-size:11px; font-weight:600;
  padding:6px 2px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.tab-btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.tab-btn.active{color:var(--accent);}
@media (prefers-reduced-motion: reduce){ .view.active{animation:none;} }

.stats-row{display:flex; gap:12px; margin-bottom:4px;}
.stat-card{flex:1; background:var(--surface-alt); border-radius:var(--radius-md); padding:16px; min-width:0;}
.stat-label{font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.stat-value{font-family:'Sora',sans-serif; font-weight:700; font-size:19px; margin-top:6px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.amt-income{color:var(--income);}
.amt-expense{color:var(--expense);}

.section-title{font-family:'Sora',sans-serif; font-weight:700; font-size:15px; margin:22px 0 6px;}

.tx-list{display:flex; flex-direction:column;}
.date-heading{font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 6px;}
.date-heading:first-child{margin-top:0;}

.tx-row{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border);}
.tx-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.tx-main{flex:1; min-width:0;}
.tx-cat{font-weight:600; font-size:14px;}
.tx-note{font-size:12px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tx-right{text-align:right;}
.tx-amt{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums;}
.tx-date{font-size:11px; color:var(--text-muted); margin-top:2px;}
.row-del{background:none; border:none; color:var(--text-muted); padding:6px; cursor:pointer; flex-shrink:0;}
.row-del svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
.row-confirm{display:flex; gap:6px; flex-shrink:0;}
.mini-btn{font-size:11px; font-weight:600; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
.mini-btn.danger{background:var(--expense); color:#fff; border-color:var(--expense);}

.link-btn{display:block; width:100%; text-align:center; background:none; border:none; color:var(--accent); font-weight:600; font-size:13px; padding:16px 0 4px; cursor:pointer;}

.fab{
  position:absolute; right:20px; bottom:calc(env(safe-area-inset-bottom,0px) + 88px);
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
  border:none; box-shadow:0 10px 24px -8px rgba(0,0,0,.45); font-size:30px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;
}
.fab[hidden]{display:none;}

.modal-overlay{position:absolute; inset:0; background:rgba(10,14,12,.5); display:flex; align-items:flex-end; z-index:30;}
.modal-overlay[hidden]{display:none;}
.sheet{width:100%; background:var(--surface); border-radius:24px 24px 0 0; padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 22px); max-height:90%; overflow-y:auto;}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.type-toggle{display:flex; background:var(--surface-alt); border-radius:12px; padding:4px; gap:4px;}
.type-btn{border:none; background:none; padding:9px 20px; border-radius:9px; font-weight:600; font-size:13px; color:var(--text-muted); cursor:pointer; font-family:'Work Sans',sans-serif;}
.type-btn.active{background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15);}
.sheet-close{border:none; background:none; color:var(--text-muted); font-size:20px; padding:6px; cursor:pointer; line-height:1;}
.field-label{display:block; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px;}
.amount-input{width:100%; border:none; background:none; font-family:'Sora',sans-serif; font-weight:800; font-size:38px; color:var(--text); font-variant-numeric:tabular-nums; padding:4px 0; border-bottom:2px solid var(--border); -webkit-appearance:none;}
.amount-input:focus{outline:none; border-color:var(--accent);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:13px; font-weight:600; padding:9px 15px; border-radius:20px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.date-input, .text-input{width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Work Sans',sans-serif; font-size:14px; padding:11px 12px; border-radius:10px;}
.save-btn{width:100%; background:var(--accent); color:var(--accent-contrast); border:none; padding:16px; border-radius:14px; font-weight:700; font-size:15px; margin-top:26px; cursor:pointer; font-family:'Work Sans',sans-serif;}
.save-btn:active{opacity:.85;}
.error-msg{color:var(--expense); font-size:12px; margin-top:8px; min-height:16px;}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script id="state-data" type="application/json">{"transactions":[]}</script>

<script id="logic-script">
(function(){
  var STORAGE_KEY = 'appJuliFinanzasState';

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.transactions)) return parsed;
      }
    }catch(e){}
    try{ return JSON.parse(document.getElementById('state-data').textContent); }
    catch(e){ return {transactions:[]}; }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();
  var currentTab = 'resumen';
  var confirmDeleteId = null;
  var modalOpen = false;
  var modalType = 'expense';
  var selectedCategory = null;

  var EXPENSE_CATS = ['Alimentación','Transporte','Vivienda','Servicios','Entretenimiento','Salud','Educación','Compras','Otros'];
  var INCOME_CATS = ['Salario','Freelance','Regalo','Ventas','Otros'];
  var CAT_COLORS = {};
  (function buildColors(){
    var palette = ['#1F6F5C','#3B7FB8','#B8862B','#8B5FBF','#B23A48','#4C8C6B','#C97A3D','#5C7AA0','#7A6A53','#2E8B57'];
    var all = EXPENSE_CATS.concat(INCOME_CATS);
    var seen = {}; var idx = 0;
    all.forEach(function(c){ if(!seen[c]){ seen[c]=true; CAT_COLORS[c]=palette[idx % palette.length]; idx++; } });
  })();

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function fmtCOP(n){
    try{ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
    catch(e){ return '$' + Math.round(n); }
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtDateShort(iso){
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  }
  function fmtDateLong(iso){
    var today = todayISO();
    var y = new Date(); y.setDate(y.getDate()-1);
    var yesterday = y.toISOString().slice(0,10);
    if(iso===today) return 'Hoy';
    if(iso===yesterday) return 'Ayer';
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('es-CO',{day:'numeric',month:'long',year: (d.getFullYear()!==new Date().getFullYear()? 'numeric':undefined)});
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var ICONS = {
    resumen: '<svg viewBox="0 0 24 24"><path d="M4 12 L12 4 L20 12"/><path d="M6 10 V20 H18 V10"/></svg>',
    movimientos: '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>',
    presupuestos: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4 V12 L18 16"/></svg>',
    metas: '<svg viewBox="0 0 24 24"><path d="M6 21 V4"/><path d="M6 4 H17 L14 8 L17 12 H6"/></svg>'
  };
  var TRASH_ICON = '<svg viewBox="0 0 24 24"><path d="M5 7 H19"/><path d="M9 7 V4 H15 V7"/><path d="M7 7 L8 20 H16 L17 7"/></svg>';

  var TABS = [
    {id:'resumen', label:'Resumen'},
    {id:'movimientos', label:'Movimientos'},
    {id:'presupuestos', label:'Presupuestos'},
    {id:'metas', label:'Metas'}
  ];

  function computeBalance(){
    return state.transactions.reduce(function(sum,t){ return sum + (t.type==='income'? t.amount : -t.amount); }, 0);
  }
  function monthTransactions(){
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    return state.transactions.filter(function(t){
      var d = new Date(t.date+'T00:00:00');
      return d.getFullYear()===y && d.getMonth()===m;
    });
  }
  function computeMonthTotals(){
    var list = monthTransactions(), income=0, expense=0;
    list.forEach(function(t){ if(t.type==='income') income+=t.amount; else expense+=t.amount; });
    return {income:income, expense:expense};
  }
  function sortedTransactions(){
    return state.transactions.slice().sort(function(a,b){
      if(a.date!==b.date) return b.date < a.date ? -1 : 1;
      return b.id.localeCompare(a.id);
    });
  }

  function txRow(t){
    var color = CAT_COLORS[t.category] || '#5C6A64';
    var sign = t.type==='income' ? '+ ' : '− ';
    var amtClass = t.type==='income' ? 'amt-income' : 'amt-expense';
    var actions;
    if(confirmDeleteId === t.id){
      actions = '<div class="row-confirm">'
        + '<button class="mini-btn danger" data-action="confirm-delete" data-id="'+t.id+'">Eliminar</button>'
        + '<button class="mini-btn" data-action="cancel-delete">Cancelar</button>'
        + '</div>';
    } else {
      actions = '<button class="row-del" data-action="ask-delete" data-id="'+t.id+'" aria-label="Eliminar movimiento">'+TRASH_ICON+'</button>';
    }
    return ''
      + '<div class="tx-row">'
      + '<span class="tx-dot" style="background:'+color+'"></span>'
      + '<div class="tx-main">'
        + '<div class="tx-cat">'+escapeHTML(t.category)+'</div>'
        + (t.note ? '<div class="tx-note">'+escapeHTML(t.note)+'</div>' : '')
      + '</div>'
      + '<div class="tx-right">'
        + '<div class="tx-amt '+amtClass+'">'+sign+fmtCOP(t.amount)+'</div>'
        + '<div class="tx-date">'+fmtDateShort(t.date)+'</div>'
      + '</div>'
      + actions
      + '</div>';
  }

  function movimientosContent(){
    var list = sortedTransactions();
    if(list.length===0){
      return '<div class="placeholder-card"><strong>Sin movimientos todavía</strong>Toca el botón + de abajo para agregar tu primer ingreso o gasto.</div>';
    }
    var html = '<div class="tx-list">';
    var lastDate = null;
    list.forEach(function(t){
      if(t.date !== lastDate){ html += '<div class="date-heading">'+fmtDateLong(t.date)+'</div>'; lastDate = t.date; }
      html += txRow(t);
    });
    html += '</div>';
    return html;
  }

  function resumenContent(){
    var totals = computeMonthTotals();
    var recent = sortedTransactions().slice(0,5);
    var html = '<div class="stats-row">'
      + '<div class="stat-card"><div class="stat-label">Ingresos del mes</div><div class="stat-value amt-income">'+fmtCOP(totals.income)+'</div></div>'
      + '<div class="stat-card"><div class="stat-label">Gastos del mes</div><div class="stat-value amt-expense">'+fmtCOP(totals.expense)+'</div></div>'
      + '</div>';
    html += '<div class="section-title">Últimos movimientos</div>';
    if(recent.length===0){
      html += '<div class="placeholder-card"><strong>Todavía no hay movimientos</strong>Toca el botón + para agregar tu primer ingreso o gasto.</div>';
    } else {
      html += '<div class="tx-list">';
      recent.forEach(function(t){ html += txRow(t); });
      html += '</div>';
      if(state.transactions.length > 5){
        html += '<button class="link-btn" data-action="goto-movimientos">Ver todos los movimientos</button>';
      }
    }
    return html;
  }

  function viewContent(id){
    if(id==='resumen') return resumenContent();
    if(id==='movimientos') return movimientosContent();
    if(id==='presupuestos') return '<div class="placeholder-card"><strong>Próximamente</strong>Aquí vas a poder definir cuánto quieres gastar por categoría cada mes.</div>';
    if(id==='metas') return '<div class="placeholder-card"><strong>Próximamente</strong>Aquí vas a poder crear metas de ahorro y ver tu progreso.</div>';
    return '';
  }

  function categoriesFor(type){ return type==='income' ? INCOME_CATS : EXPENSE_CATS; }

  function chipsHTML(){
    var cats = categoriesFor(modalType);
    return cats.map(function(c){
      return '<button type="button" class="chip'+(c===selectedCategory?' active':'')+'" data-action="select-cat" data-cat="'+c+'">'+c+'</button>';
    }).join('');
  }

  function modalHTML(){
    return ''
      + '<div class="modal-overlay" id="modal-overlay"'+(modalOpen?'':' hidden')+'>'
      + '<div class="sheet">'
        + '<div class="sheet-handle"></div>'
        + '<div class="sheet-header">'
          + '<div class="type-toggle">'
            + '<button type="button" class="type-btn'+(modalType==='expense'?' active':'')+'" data-action="select-type" data-type="expense">Gasto</button>'
            + '<button type="button" class="type-btn'+(modalType==='income'?' active':'')+'" data-action="select-type" data-type="income">Ingreso</button>'
          + '</div>'
          + '<button type="button" class="sheet-close" data-action="close-modal" aria-label="Cerrar">✕</button>'
        + '</div>'
        + '<input type="number" inputmode="decimal" id="input-amount" class="amount-input" placeholder="$ 0" />'
        + '<div class="field-label">Categoría</div>'
        + '<div class="chip-row" id="category-chips">'+chipsHTML()+'</div>'
        + '<div class="field-label">Fecha</div>'
        + '<input type="date" id="input-date" class="date-input" value="'+todayISO()+'" />'
        + '<div class="field-label">Nota (opcional)</div>'
        + '<input type="text" id="input-note" class="text-input" placeholder="Ej: Mercado de la semana" maxlength="60" />'
        + '<div class="error-msg" id="modal-error"></div>'
        + '<button type="button" class="save-btn" data-action="save-tx">Guardar</button>'
      + '</div>'
      + '</div>';
  }

  function render(){
    var root = document.getElementById('app');
    var showFab = (currentTab==='resumen' || currentTab==='movimientos');
    var html = '';
    html += '<div class="topbar"><div class="label">Balance total</div><div class="balance">' + fmtCOP(computeBalance()) + '</div><div class="sub">Finanzas de Juli</div></div>';
    html += '<div class="content">';
    TABS.forEach(function(t){
      html += '<div class="view' + (t.id===currentTab ? ' active' : '') + '" data-view="' + t.id + '">' + viewContent(t.id) + '</div>';
    });
    html += '</div>';
    html += '<button type="button" class="fab" data-action="open-modal"'+(showFab?'':' hidden')+' aria-label="Agregar movimiento">+</button>';
    html += '<div class="tabbar">';
    TABS.forEach(function(t){
      html += '<button class="tab-btn' + (t.id===currentTab ? ' active' : '') + '" data-tab="' + t.id + '">' + ICONS[t.id] + '<span>' + t.label + '</span></button>';
    });
    html += '</div>';
    html += modalHTML();
    root.innerHTML = html;

    var tabButtons = root.querySelectorAll('.tab-btn');
    for(var i=0;i<tabButtons.length;i++){
      tabButtons[i].addEventListener('click', function(e){
        currentTab = e.currentTarget.getAttribute('data-tab');
        confirmDeleteId = null;
        render();
      });
    }

    if(modalOpen){
      var amountInput = document.getElementById('input-amount');
      if(amountInput) amountInput.focus();
    }
  }

  function openModal(){
    modalType = 'expense';
    selectedCategory = EXPENSE_CATS[0];
    modalOpen = true;
    render();
  }
  function closeModal(){
    modalOpen = false;
    render();
  }
  function setModalType(type){
    modalType = type;
    selectedCategory = categoriesFor(type)[0];
    var chips = document.getElementById('category-chips');
    if(chips) chips.innerHTML = chipsHTML();
    var typeBtns = document.querySelectorAll('.type-btn');
    typeBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-type')===type); });
  }
  function selectCategory(cat){
    selectedCategory = cat;
    var chips = document.querySelectorAll('#category-chips .chip');
    chips.forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-cat')===cat); });
  }
  function handleSaveTx(){
    var amountInput = document.getElementById('input-amount');
    var dateInput = document.getElementById('input-date');
    var noteInput = document.getElementById('input-note');
    var errorEl = document.getElementById('modal-error');
    var amount = parseFloat(amountInput.value);
    if(!amount || amount <= 0){
      errorEl.textContent = 'Ingresa un monto válido, mayor a cero.';
      return;
    }
    if(!selectedCategory){
      errorEl.textContent = 'Elige una categoría.';
      return;
    }
    var date = dateInput.value || todayISO();
    var note = (noteInput.value || '').trim();
    state.transactions.push({
      id: uid(),
      type: modalType,
      amount: amount,
      category: selectedCategory,
      date: date,
      note: note
    });
    saveState();
    modalOpen = false;
    render();
  }
  function deleteTx(id){
    state.transactions = state.transactions.filter(function(t){ return t.id !== id; });
    saveState();
    confirmDeleteId = null;
    render();
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    if(action==='open-modal') openModal();
    else if(action==='close-modal') closeModal();
    else if(action==='select-type') setModalType(btn.getAttribute('data-type'));
    else if(action==='select-cat') selectCategory(btn.getAttribute('data-cat'));
    else if(action==='save-tx') handleSaveTx();
    else if(action==='ask-delete'){ confirmDeleteId = btn.getAttribute('data-id'); render(); }
    else if(action==='cancel-delete'){ confirmDeleteId = null; render(); }
    else if(action==='confirm-delete'){ deleteTx(btn.getAttribute('data-id')); }
    else if(action==='goto-movimientos'){ currentTab = 'movimientos'; render(); }
  });

  render();
})();
</script>
</body>
</html>
